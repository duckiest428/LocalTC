# LocalTC configuration.
# Override the source without editing this file: LOCALTC_SOURCE=live|replay
# Use a different config file: LOCALTC_CONFIG=path/to/file.toml

[source]
kind = "replay"               # "live" (Windows + MSFS 2024) or "replay" (any OS)

[live]
dll_path = ""                 # blank = auto-detect (LOCALTC_SIMCONNECT_DLL, MSFS2024_SDK, MSFS_SDK, ./SimConnect.dll)
app_name = "LocalTC"
ownship_hz = 4.0              # own-aircraft state rate
traffic_interval_s = 3.0      # nearby-traffic scan interval (0 disables)
traffic_radius_m = 50000      # nearby-traffic scan radius
retry_max_s = 15.0            # max back-off between connection attempts
connect_timeout_s = 0.0       # 0 = wait for the sim indefinitely

[replay]
path = "tests/fixtures/pattern_short"
speed = 1.0                   # 2.0 = twice as fast, 0 = as fast as possible
start_at = 0.0                # seconds into the recording
loop = false

[flight]
rules = "IFR"
destination = ""              # ICAO, e.g. "KBFI"
cruise_ft = 0                 # planned cruise altitude; 0 = unknown
callsign = ""                 # blank = the aircraft's ATC ID from the sim
approach = "auto"             # auto: what the airport publishes, the weather and the aircraft allow (the US and Canada in good weather: the visual); or visual|ils|rnav

[atc]
enabled = true
seed = 0                      # 0 = derived from callsign + date (squawk, ATIS letter, phrasing variants)
center_name = "Seattle"       # the first centre after departure, when no airport lists a CENTER
center_mhz = 125.1            # frequency. Enroute, centres are named after the region flown over.
strict_callsign = false       # true: a readback without the callsign is incomplete
transition_ft = 18000         # at or above this, flight levels and no local altimeter (STD)
unscripted = true             # ATC starts things too: traffic calls, altitude checks, "how do you read?"
notams = true                 # notices on the ATIS (a taxiway closed, an ILS out, birds ...); ATC works to them
chatter = true                # other flights heard on the frequency now and then (nothing behind them to answer)
enforce_fpln_runways = false  # true: ATC gives the flight plan's runways; false: the runways in use (ATIS, else wind)
real_gates = true             # gates by their real names (E9), international flights to international gates: from OpenStreetMap, cached
traffic_runways = true        # the runway in use goes the way the sim's AI traffic takes off and lands (wind allowing)
radio_range = true            # an airport's frequencies reach only so far: tower 20-60 nm, ground a few miles
callsign_check = true         # another flight's callsign heard: "station calling, say again your callsign"
airport_dirs = []             # extra folders of <ICAO>.json airport files

[atc.phase]                   # PhaseThresholds overrides, e.g. taxi_start_kt = 4

[llm]                         # local language model via Ollama (https://ollama.com); nothing leaves this machine
enabled = true
base_url = "http://127.0.0.1:11434"
model = "llama3.2:3b"         # ollama pull llama3.2:3b
mode = "mostly_llm"           # how much ATC leans on the model, for reading calls and wording replies:
                              #   scripted: the script; the model only for a call the grammar can't read
                              #   semi: the script for clear routine calls; the model for the rest, and its wording off the script
                              #   mostly_llm: the model reads and words most calls; the script takes the clearly routine ones
                              #   llm: the model reads and words every call (the script checks it, and answers when it fails)
                              #   off: the grammar and the templates only
phrasing = true               # the model may word replies at all (false: templates only, whatever the mode)
beyond_facts = false          # true: its answers may go past the sim's data (what it knows itself); never instructions
timeout_s = 4.0               # per model call; on timeout the grammar's answer is used
budget_s = 6.0                # per pilot transmission, including one retry
patience_s = 15.0             # off-script calls the model missed: one more try this long (the app shows ATC thinking)
max_attempts = 2
keep_alive = "1h"             # how long the model stays loaded after a flight ("0": unload at once); during one it always stays
num_ctx = 3072                # the model's working memory, in tokens: a call needs up to about 2,100; more is memory for nothing
cpu_only = true               # the model on the CPU only, leaving the graphics card to the sim (timeouts doubled); from the next flight
cpu_threads = 0               # CPU threads for the model; 0: Ollama's choice
replay = "recorded"           # in replays: "recorded" answers, "live" model, or "off"

[session]
auto_stop_at_gate = true      # stop the flight once parked at a gate or stand at the destination (stopped, taxi done)
auto_stop_in_replay = false   # ... in a replay too
gate_radius_m = 30.0          # this close to a gate or parking spot counts as at it
auto_stop_delay_s = 8.0       # time for ATC's last words before the flight stops

[cloud]                       # optional: language models in the cloud, recommended for quality (off by default)
enabled = false               # on: the flight's words go to the service answering; keys are kept in the system's credential store
# Tried first to last: Mistral (most generous free limits), then the no-key one. One that needs a key is skipped until it has one (Settings > Cloud).
order = ["mistral", "groq", "aistudio", "cloudflare", "nvidia", "siliconflow", "pollinations"]
copilot = true                # the copilot asks the cloud too (its own connection); off: the model on this PC
local_fallback = false        # on: every service failing, the local model answers
timeout_s = 6.0               # per call, every service tried in it

[voice]                       # talk to ATC (or use --voice); install with the installer or pip install -e ".[voice]"
enabled = false
ptt = "keyboard"              # keyboard | joystick | enter (Enter in this window starts and stops a transmission)
ptt_key = "ctrl_r"            # keyboard: hold to talk; works while the sim has focus (ctrl_r, alt_r, f13, a letter...)
ptt_joystick = "joystick:0:button:0"   # joystick: the button as MSFS names it (bound through SimConnect)
intercom_key = "alt_r"        # hold to talk to the copilot instead of ATC (keyboard; blank: none)
intercom_joystick = ""        # ... or a joystick button for it, as MSFS names it
input_device = ""             # blank = default microphone; or part of its name (localtc voice devices)
model = "auto"                # auto: small.en with an NVIDIA GPU, base.en otherwise; tiny.en ... large-v3
device = "auto"               # auto | cpu | cuda
compute_type = "auto"
models_dir = ""               # blank = %LOCALAPPDATA%\LocalTC\models (filled by localtc setup)
beam_size = 5
vocabulary = true             # prime Whisper with aviation words and this flight's callsign, stations, runways
pre_roll_ms = 300
tail_ms = 250

[tts]                         # ATC talks back (Piper); --no-tts for text only
enabled = true
voice = "en_US-libritts_r-medium"   # multi-speaker: every controller gets its own voice (localtc setup downloads it)
voices_dir = ""               # blank = %LOCALAPPDATA%\LocalTC\voices
output_device = ""            # blank = default speakers/headset; or part of its name (localtc tts devices)
volume = 0.8
rate = 1.15                   # speaking speed (1 = Piper's normal pace)
radio_effect = true           # band-pass, compression, static and squelch
static = 0.35                 # 0-1
atis = true                   # read the ATIS aloud while it's tuned
copilot = true                # speak the copilot's calls too

[copilot]                     # works the radio for you (or use --copilot)
mode = "off"                  # off | assist (readbacks + frequency changes) | full (every call)
delay_min_s = 2.0             # reaction time before the copilot speaks
delay_max_s = 4.0

[crew]                        # the copilot as Pilot Monitoring, on the intercom (needs [voice] for speech)
enabled = true                # the intercom key talks to the copilot: "flaps two", "gear down", "squawk 4521"
voice_sex = "any"             # the copilot's voice: female | male | any
voice_pick = 0                # which of that sex's voices, 0-7 (the copilot uses it on the radio too)
llm = "full"                  # the language model on the intercom: off | questions | full (commands in other words, confirmed)
verbosity = "standard"        # what it says by itself: quiet (safety only) | standard (callouts, relays, reminders) | chatty
hands = "pm"                  # pm: it works its own side (radios, transponder, altimeter, lights, gear and flaps after takeoff) | calls: says only
repeat_atc = false            # chatty only: the key part of each ATC instruction said back to you before your readback

[recorder]
enabled = true
dir = "recordings"
flush_interval_s = 1.0
compress = false              # gzip session.jsonl when the session ends
