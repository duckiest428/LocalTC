[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "localtc"
version = "0.3.0"
description = "Free, offline-capable ATC for Microsoft Flight Simulator 2024"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "msgspec>=0.18",
    # Voice input: speech-to-text, the microphone, and a push-to-talk key that works while the sim has focus.
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "pynput>=1.7",
    # Voice out: Piper speech synthesis (prebuilt wheels for Windows, macOS and Linux; no separate binary).
    "piper-tts>=1.3",
    # The app's window (Edge WebView2, built into Windows 10/11). Elsewhere the app opens in the browser.
    "pywebview>=5.3; sys_platform == 'win32'",
    # The optional account's sign-in, kept in Windows Credential Manager / the macOS Keychain.
    "keyring>=25",
    # The companion app finds LocalTC on the local network by Bonjour (_localtc._tcp).
    "zeroconf>=0.136",
]

[project.optional-dependencies]
dev = ["pytest>=8", "import-linter>=2.0"]
# Whisper on an NVIDIA GPU (the installer adds this when it finds one). CUDA 12 / cuDNN 9, as ctranslate2 needs.
cuda = [
    "nvidia-cublas-cu12>=12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
localtc = "localtc.cli:main"

[project.gui-scripts]
localtc-app = "localtc.ui:main"  # the app without a console window (the desktop shortcut)

[tool.hatch.build.targets.wheel]
packages = ["src/localtc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "windows: needs Windows and a running MSFS 2024 (set LOCALTC_LIVE_SIM=1)",
    "ollama: needs a running Ollama with the configured model (skipped otherwise)",
    "whisper: needs the Whisper base.en model (localtc setup); skipped otherwise",
]

# Architecture rules. Run with `lint-imports`; tests/test_architecture.py checks the same rules.
[tool.importlinter]
root_package = "localtc"

[[tool.importlinter.contracts]]
name = "sim_api depends on nothing else in LocalTC"
type = "forbidden"
source_modules = ["localtc.sim_api"]
forbidden_modules = [
    "localtc.app", "localtc.atc_core", "localtc.bus", "localtc.cli", "localtc.config", "localtc.copilot",
    "localtc.dsp", "localtc.llm", "localtc.recorder", "localtc.replay", "localtc.scenario", "localtc.sim_bridge",
    "localtc.stt", "localtc.tts", "localtc.ui", "localtc.flightplan", "localtc.models",
    "localtc.account", "localtc.logbook", "localtc.update", "localtc.radiolog",
]

[[tool.importlinter.contracts]]
name = "Only app wiring may import the Windows-only SimConnect bridge"
type = "forbidden"
source_modules = [
    "localtc.atc_core", "localtc.bus", "localtc.config", "localtc.copilot", "localtc.dsp", "localtc.llm",
    "localtc.recorder", "localtc.replay", "localtc.sim_api", "localtc.stt", "localtc.tts", "localtc.flightplan",
    "localtc.models",
]
forbidden_modules = ["localtc.sim_bridge"]

[[tool.importlinter.contracts]]
name = "Speech-to-text depends only on sim_api and bus"
type = "forbidden"
source_modules = ["localtc.stt"]
forbidden_modules = [
    "localtc.app", "localtc.atc_core", "localtc.cli", "localtc.copilot", "localtc.llm", "localtc.recorder",
    "localtc.replay", "localtc.scenario", "localtc.sim_bridge", "localtc.tts", "localtc.voice",
]

[[tool.importlinter.contracts]]
name = "Voice out and the radio effect depend only on sim_api and bus"
type = "forbidden"
source_modules = ["localtc.tts", "localtc.dsp"]
forbidden_modules = [
    "localtc.app", "localtc.atc_core", "localtc.cli", "localtc.copilot", "localtc.llm", "localtc.recorder",
    "localtc.replay", "localtc.scenario", "localtc.sim_bridge", "localtc.stt", "localtc.voice",
]

[[tool.importlinter.contracts]]
name = "ATC core depends only on sim_api, bus and airports (no HTTP, no copilot)"
type = "forbidden"
source_modules = ["localtc.atc_core"]
forbidden_modules = [
    "localtc.app", "localtc.cli", "localtc.copilot", "localtc.dsp", "localtc.llm", "localtc.recorder",
    "localtc.replay", "localtc.scenario", "localtc.sim_bridge", "localtc.stt", "localtc.tts", "localtc.voice",
    "localtc.account", "localtc.logbook", "localtc.update",
]

[[tool.importlinter.contracts]]
name = "The ATC never reaches the network: accounts, the logbook and updates stay outside it"
type = "forbidden"
source_modules = ["localtc.atc_core", "localtc.stt", "localtc.tts", "localtc.dsp", "localtc.copilot", "localtc.llm"]
forbidden_modules = ["localtc.account", "localtc.update", "localtc.ui"]
