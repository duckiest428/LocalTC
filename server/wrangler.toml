# The optional LocalTC account server. See README.md for setting it up on a Cloudflare account.
name = "localtc-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# api.localtc.tech -> this Worker. Needs the localtc.tech zone on the same Cloudflare account.
# localtc.tech/f/* and /w/* (shared flights and Wrapped recaps) too: the site is static, and a chat app
# unfurling a link needs the page's own title and card in its HTML. Every other path stays the site's.
routes = [
  { pattern = "api.localtc.tech", custom_domain = true },
  { pattern = "localtc.tech/f/*", zone_name = "localtc.tech" },
  { pattern = "localtc.tech/w/*", zone_name = "localtc.tech" },
]
workers_dev = false  # only api.localtc.tech; no *.workers.dev address

[vars]
SITE_URL = "https://localtc.tech"
ALLOWED_ORIGINS = "https://localtc.tech,https://www.localtc.tech"
COOKIE_DOMAIN = ""  # host-only: the cookie goes to api.localtc.tech alone (the dashboard is same-site)
MAIL_FROM = "LocalTC <accounts@localtc.tech>"
EMAIL_MODE = "resend"  # "resend" sends with Resend (RESEND_API_KEY secret); "log" prints links (local dev)
APNS_HOST = "api.push.apple.com"  # api.sandbox.push.apple.com for development builds of the iOS app
APNS_TOPIC = ""  # the companion app's bundle id; push is off until it and the APNS_* secrets are set
# Secrets (wrangler secret put NAME): RESEND_API_KEY, SUPPORT_EMAIL (where Support messages go),
# APNS_KEY_ID, APNS_TEAM_ID, APNS_PRIVATE_KEY

[[d1_databases]]
binding = "DB"
database_name = "localtc"
database_id = "4726c6a6-fc3d-4a9f-ab01-892c7dea9129"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

# Daily: expired sessions and links, old rate-limit counters, accounts never confirmed.
[triggers]
crons = ["17 3 * * *"]

[env.dev.vars]
SITE_URL = "http://localhost:8000"
ALLOWED_ORIGINS = "http://localhost:8000"
COOKIE_DOMAIN = ""
EMAIL_MODE = "log"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "localtc"
database_id = "local-dev"
migrations_dir = "migrations"

[[env.dev.durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"
