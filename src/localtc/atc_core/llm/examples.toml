[[example]]
# A pilot report of the ride or icing: not a request, not a question.
mode = "request"
phase = "CRUISE"
station = "Seattle Center"
pilot = "Center, 2LT, we're getting some moderate chop at seven thousand"
answer = { kind = "request", intent = "report_conditions", topic = "", runway = "", atis = "", altitude = "7000", fix = "", approach = "", conditions = "moderate chop", emergency = "", souls = "", fuel = "" }
