# Few-shot examples for the understanding prompt: (the moment, the pilot's words) -> the JSON answer, shown to
# the model before the real transmission. They cover the edge cases a small model gets wrong without them.
#
# Every call is shown all of them, readbacks and requests alike, in this order: the prompt is then the same
# up to the real call's last lines, so Ollama reads it once and reuses it. A prompt that changes earlier than
# that (a set per kind of call, say) is read again from there, and on a CPU shared with the sim that's tens of
# seconds: a timeout. Keep them few and short, for the same reason.
#
# mode: "readback" when a readback is expected (expect lists its elements, "element=value"), else "request".
# callsign, cleared (altitude, heading, squawk, runway, approach), traffic and recent are the moment as the
# engine knows it: several show values there the pilot didn't say, and an answer that leaves them out.
# Answers carry only what the pilot said: a field left out is one not said.

[[example]]
mode = "readback"
phase = "RUNWAY_HOLD"
station = "Montreal Tower"
callsign = "DP69"
cleared = { altitude = "5000", squawk = "5015", runway = "06L" }
recent = ["ATC: \"DP69, runway 06L, cleared for takeoff.\""]
expect = ["runway=06L", "cleared_for_takeoff"]
pilot = "clear for take off zero six left, delta papa six nine"
answer = { kind = "readback", runway = "06L", cleared_for_takeoff = true }

[[example]]
mode = "request"
phase = "CRUISE"
station = "Seattle Center"
callsign = "Alaska 123 (ASA123)"
cleared = { altitude = "11000", squawk = "2213" }
pilot = "Seattle Center, Alaska 123, level one one thousand"
answer = { kind = "request", intent = "checkin", altitude = "11000" }

# The pilot said a different squawk: the pilot's number, never the expected one.
[[example]]
mode = "readback"
phase = "PARKED"
station = "Montreal Clearance"
callsign = "DP69"
expect = ["altitude=5000", "frequency=120.42", "squawk=5015"]
pilot = "cleared as filed, five thousand, one twenty point four two, squawk five zero five one, DP69"
answer = { kind = "readback", altitude = "5000", frequency = "120.42", squawk = "5051" }

[[example]]
mode = "request"
phase = "DEPARTURE"
station = "Seattle Departure"
callsign = "N172LT"
cleared = { altitude = "5000", squawk = "4521" }
pilot = "Seattle Departure, N172LT, two thousand three hundred climbing five thousand"
answer = { kind = "request", intent = "checkin", altitude = "2300" }

# Asking for a repeat is not a readback.
[[example]]
mode = "readback"
phase = "PARKED"
station = "Montreal Clearance"
callsign = "DP69"
expect = ["altitude=5000", "frequency=120.42", "squawk=5015"]
pilot = "say again the squawk for DP69"
answer = { kind = "request", intent = "say_again" }

[[example]]
mode = "request"
phase = "PARKED"
station = "Paine Ground"
callsign = "N172LT"
pilot = "ground N172LT at the west ramp with bravo, ready to taxi"
answer = { kind = "request", intent = "ready_to_taxi", atis = "B" }

# Only part of the instruction read back: leave the rest out.
[[example]]
mode = "readback"
phase = "CRUISE"
station = "Montreal Departure"
callsign = "Air Canada 326 (ACA326)"
cleared = { altitude = "11000", squawk = "3321" }
expect = ["frequency=135.025"]
pilot = "over to center, air canada three twenty six"
answer = { kind = "readback" }

[[example]]
mode = "request"
phase = "CRUISE"
station = "Montreal Center"
callsign = "DP69"
cleared = { altitude = "24000", squawk = "5015" }
pilot = "what's the altimeter in quebec"
answer = { kind = "question", topic = "altimeter" }

# Reading back and asking in one call: kind is readback, intent is what they asked for.
[[example]]
mode = "readback"
phase = "LANDING"
station = "Boeing Tower"
callsign = "N172LT"
cleared = { runway = "14R", approach = "ILS 14R" }
expect = ["runway=14R", "cleared_to_land"]
pilot = "cleared to land one four right, actually can we make that a low approach, two lima tango"
answer = { kind = "readback", intent = "request_option", runway = "14R", cleared_to_land = true }

[[example]]
mode = "request"
phase = "CRUISE"
station = "Montreal Center"
callsign = "Air Canada 326 (ACA326)"
cleared = { altitude = "20000", squawk = "3321" }
pilot = "Air Canada 326 request flight level two four zero"
answer = { kind = "request", intent = "request_altitude", altitude = "24000" }

# An approach clearance read back is a readback, never a request for a clearance.
[[example]]
mode = "readback"
phase = "APPROACH"
station = "Seattle Approach"
callsign = "Air Canada 8272 (ACA8272)"
cleared = { altitude = "5000", runway = "34R" }
expect = ["heading=020", "altitude=2500", "approach=ILS 34R"]
pilot = "left zero two zero, two thousand five hundred til established, cleared ILS three four right, Air Canada 8272"
answer = { kind = "readback", heading = "020", altitude = "2500", approach = "ILS 34R" }

[[example]]
mode = "request"
phase = "DEPARTURE"
station = "Montreal Departure"
callsign = "DP69"
pilot = "mayday mayday mayday DP69 engine fire, two souls on board, one hour of fuel"
answer = { kind = "request", intent = "emergency", emergency = "engine fire", souls = "2", fuel = "1 hour" }

# A different runway or approach type is request_runway, even when it mentions vectors or an altitude.
[[example]]
mode = "request"
phase = "APPROACH"
station = "Phoenix Approach"
callsign = "EXP69"
cleared = { altitude = "8000", heading = "250" }
pilot = "EXP69 would like the visual for runway two six instead"
answer = { kind = "request", intent = "request_runway", runway = "26", approach = "VISUAL" }

# Traffic ATC called: "looking" or "in sight" is a traffic report, whatever else is said.
[[example]]
mode = "request"
phase = "DEPARTURE"
station = "Seattle Departure"
callsign = "N172LT"
traffic = "2 o'clock, 3 miles, 4,000 ft"
pilot = "looking for the traffic, two lima tango"
answer = { kind = "request", intent = "traffic_report" }

[[example]]
mode = "request"
phase = "CRUISE"
station = "Seattle Center"
callsign = "N172LT"
cleared = { altitude = "7000" }
pilot = "Center, 2LT, we're getting some moderate chop at seven thousand"
answer = { kind = "request", intent = "report_conditions", altitude = "7000", conditions = "moderate chop" }

[[example]]
mode = "request"
phase = "CRUISE"
station = "Seattle Center"
callsign = "N172LT"
cleared = { altitude = "9000" }
pilot = "Seattle Center, N172LT, request direct BLAKO"
answer = { kind = "request", intent = "request_direct", fix = "BLAKO" }

[[example]]
mode = "request"
phase = "TAXI_OUT"
station = "Vancouver Tower"
callsign = "Air Canada 8272 (ACA8272)"
cleared = { runway = "31" }
pilot = "Tower, Air Canada 8272, request to cross runway one six left"
answer = { kind = "request", intent = "request_crossing", runway = "16L" }

# A request with no procedure for it is "other".
[[example]]
mode = "request"
phase = "APPROACH"
station = "Seattle Approach"
callsign = "Alaska 123 (ASA123)"
pilot = "Alaska 123 would like to hold present position for a few minutes"
answer = { kind = "request", intent = "other" }

[[example]]
mode = "request"
phase = "RUNWAY_HOLD"
station = "Vancouver Tower"
callsign = "Air Canada 8272 (ACA8272)"
cleared = { runway = "31" }
pilot = "we're not quite there yet, give us a little more time, Air Canada 8272"
answer = { kind = "request", intent = "need_time" }

[[example]]
mode = "request"
phase = "PARKED"
station = "Montreal Ground"
callsign = "DP69"
pilot = "uh the uh we're uh"
answer = { kind = "unintelligible" }
