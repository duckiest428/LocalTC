[[template]]
id = "approach.descend"
controller = "approach"
text = ["{callsign}, {station}, descend and maintain {altitude}, expect {approach} approach."]
readback = { required = ["altitude"] }
pilot_readback = "Descend and maintain {altitude}, expect {approach}, {callsign_short}."

[[template]]
id = "approach.maintain"
controller = "approach"
text = ["{callsign}, {station}, maintain {altitude}, expect {approach} approach."]
readback = { required = ["altitude"] }
pilot_readback = "Maintain {altitude}, expect {approach}, {callsign_short}."

# The frequency is what matters on a busy final; repeating the approach name is welcome, not required.
[[template]]
id = "approach.cleared"
controller = "approach"
text = ["{callsign}, cleared {approach} approach, contact {station} {frequency}."]
readback = { required = ["frequency"], optional = ["approach"] }
pilot_readback = "Cleared {approach} approach, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.vectors"
controller = "approach"
text = ["{callsign}, fly heading {heading}, vectors for the {approach} approach."]
readback = { required = ["heading"] }
pilot_readback = "Heading {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
controller = "approach"
text = ["{callsign}, roger, fly runway heading, climb and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Runway heading, climb and maintain {altitude}, {callsign_short}."
