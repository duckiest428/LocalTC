[[template]]
id = "approach.descend"
controller = "approach"
text = ["{callsign}, {station}, descend and maintain {altitude}, expect {approach} approach.",
        "{callsign}, {station}, expect {approach} approach, descend and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Descend and maintain {altitude}, expect {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
controller = "approach"
text = ["{callsign}, {station}, expect {approach} approach.",
        "{callsign}, {station}, roger, expect {approach} approach."]

[[template]]
id = "approach.checkin_roger"
controller = "approach"
text = ["{callsign}, {station}, roger.", "{callsign}, roger.", "{callsign}, {station}."]

[[template]]
id = "approach.maintain"
controller = "approach"
text = ["{callsign}, {station}, maintain {altitude}, expect {approach} approach."]
readback = { required = ["altitude"] }
pilot_readback = "Maintain {altitude}, expect {approach}, {callsign_short}."

# The frequency is what matters on a busy final; repeating the approach name is welcome, not required.
[[template]]
id = "approach.cleared"
controller = "approach"
text = ["{callsign}, cleared {approach} approach, contact {station} {frequency}."]
readback = { required = ["frequency"], optional = ["approach"] }
pilot_readback = "Cleared {approach} approach, {station} {frequency}, {callsign_short}."

# Short final and never switched to tower (no landing clearance): approach sends the flight around.
[[template]]
id = "approach.go_around_no_clearance"
controller = "approach"
text = ["{callsign}, go around, you're not cleared to land, fly runway heading, climb and maintain {altitude}.",
        "{callsign}, go around, no landing clearance, fly runway heading, climb and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Going around, runway heading, climb and maintain {altitude}, {callsign_short}."

# The check-in after a go-around, sent back from tower: on radar again, and round for another try.
[[template]]
id = "approach.go_around_checkin"
controller = "approach"
text = ["{callsign}, {station}, radar contact, maintain {altitude}, expect vectors for the {approach} approach.",
        "{callsign}, {station}, roger, maintain {altitude}, vectors for another {approach} approach."]
readback = { required = ["altitude"] }
pilot_readback = "Maintain {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
controller = "approach"
text = ["{callsign}, fly heading {heading}, vectors for the {approach} approach."]
readback = { required = ["heading"] }
pilot_readback = "Heading {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
controller = "approach"
text = ["{callsign}, roger, fly runway heading, climb and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Runway heading, climb and maintain {altitude}, {callsign_short}."

# Vectors ATC gives without being asked, turning the aircraft onto the final.
[[template]]
id = "approach.turn"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}, vector for the {approach} approach.",
        "{callsign}, fly heading {heading}, vector for the {approach} approach."]
readback = { required = ["heading"] }
pilot_readback = "Heading {heading}, {callsign_short}."

# A vector after the first: what they're for has been said.
[[template]]
id = "approach.heading"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}.", "{callsign}, fly heading {heading}."]
readback = { required = ["heading"] }
pilot_readback = "Heading {heading}, {callsign_short}."

[[template]]
id = "approach.turn_descend"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}, descend and maintain {altitude}."]
readback = { required = ["heading", "altitude"] }
pilot_readback = "Turn {turn} heading {heading}, descend and maintain {altitude}, {callsign_short}."

[[template]]
id = "approach.downwind"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}, vectors {approach} approach.", "{callsign}, turn {turn} heading {heading}, vectors for runway {runway}."]
readback = { required = ["heading"] }
pilot_readback = "Heading {heading}, {callsign_short}."

[[template]]
id = "approach.base"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}.", "{callsign}, turn {turn} heading {heading}, vectors to final."]
readback = { required = ["heading"] }
pilot_readback = "Turn {turn} heading {heading}, {callsign_short}."

[[template]]
id = "approach.intercept_cleared"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}, maintain {altitude} until established on the localizer, cleared {approach} approach."]
readback = { required = ["heading", "altitude"], optional = ["approach"] }
pilot_readback = "Turn {turn} heading {heading}, maintain {altitude} until established, cleared {approach} approach, {callsign_short}."

# A VOR, NDB or RNAV approach (and a circling one off it): no localizer, the final approach course (7110.65 4-8-1).
[[template]]
id = "approach.intercept_course"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}, maintain {altitude} until established on the final approach course, cleared {approach} approach."]
readback = { required = ["heading", "altitude"], optional = ["approach"] }
pilot_readback = "Turn {turn} heading {heading}, maintain {altitude} until established, cleared {approach} approach, {callsign_short}."

# The visual: no localizer to be established on, no altitude to hold until then.
[[template]]
id = "approach.intercept_visual"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}, cleared {approach} approach."]
readback = { required = ["heading"], optional = ["approach"] }
pilot_readback = "Turn {turn} heading {heading}, cleared {approach} approach, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
controller = "approach"
text = ["{callsign}, contact {station} {frequency}.",
        "{callsign}, contact {station} {frequency}, good day.",
        "{callsign}, contact {station} on {frequency}."]
readback = { required = ["frequency"] }
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
controller = "approach"
text = ["{callsign}, turn {turn} heading {heading}, join the final approach course, {approach} approach."]
readback = { required = ["heading"] }
pilot_readback = "Heading {heading} to join, {callsign_short}."

[[template]]
id = "approach.speed"
controller = "approach"
text = ["{callsign}, reduce speed to {speed} knots."]  # only ever said to an aircraft going faster than that
readback = { required = ["speed"] }
pilot_readback = "{speed} knots, {callsign_short}."

# On a STAR that runs onto the final: the arrival flies it, and the approach clearance comes on the way.
[[template]]
id = "approach.cleared_star"
controller = "approach"
text = ["{callsign}, cleared {approach} approach."]
readback = { required = ["approach"] }
pilot_readback = "Cleared {approach} approach, {callsign_short}."
