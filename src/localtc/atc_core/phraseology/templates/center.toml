[[template]]
id = "center.checkin"
controller = "center"
text = ["{callsign}, {station}, roger."]

# The new controller already has the flight: it reads back what it has rather than starting over.
[[template]]
id = "center.radar_contact"
controller = "center"
text = ["{callsign}, {station}, radar contact, climb and maintain {altitude}.",
        "{callsign}, {station}, radar contact, climb and maintain {altitude}, proceed on course.",
        "{callsign}, radar contact, climb and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Climb and maintain {altitude}, {callsign_short}."

[[template]]
id = "center.checkin_level"
controller = "center"
text = ["{callsign}, {station}, radar contact, maintain {altitude}.", "{callsign}, {station}, roger, maintain {altitude}."]

# Checking in level at what it's had from the last centre, now and then: the acknowledgement alone.
[[template]]
id = "center.checkin_ack"
controller = "center"
text = ["{callsign}, {station}, radar contact.", "{callsign}, radar contact.", "{callsign}, {station}, roger."]

# Checking in level below what was assigned: the climb, given again.
[[template]]
id = "center.checkin_climb"
controller = "center"
text = ["{callsign}, {station}, radar contact, climb and maintain {altitude}.",
        "{callsign}, {station}, roger, climb and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Climb and maintain {altitude}, {callsign_short}."

# Checking in still on the way up to what was assigned: carry on, not "maintain" as if it were there.
[[template]]
id = "center.checkin_climbing"
controller = "center"
text = ["{callsign}, {station}, radar contact, continue climb, maintain {altitude}.",
        "{callsign}, {station}, roger, continue climb, maintain {altitude}."]

[[template]]
id = "center.checkin_descending"
controller = "center"
text = ["{callsign}, {station}, roger, continue descent to {altitude}."]

[[template]]
id = "center.checkin_descend"
controller = "center"
text = ["{callsign}, {station}, radar contact, descend and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Descend and maintain {altitude}, {callsign_short}."

[[template]]
id = "center.checkin_descend_via"
controller = "center"
text = ["{callsign}, {station}, roger, descend via the {procedure} arrival."]

[[template]]
id = "center.descend"
controller = "center"
text = ["{callsign}, descend and maintain {altitude}, expect {approach} approach."]
readback = { required = ["altitude"] }
pilot_readback = "Descend and maintain {altitude}, {callsign_short}."

# Already at or below the arrival altitude (a low cruise): no descent, just the plan.
[[template]]
id = "center.descend_pd"
controller = "center"
text = ["{callsign}, descend at pilot's discretion, maintain {altitude}, expect {approach} approach."]
readback = { required = ["altitude"] }
pilot_readback = "Pilot's discretion, descend and maintain {altitude}, {callsign_short}."

[[template]]
id = "center.descend_via"
controller = "center"
text = ["{callsign}, descend via the {procedure} arrival, expect {approach} approach."]
readback = { required = ["descend_via"], optional = ["procedure"] }
pilot_readback = "Descend via the {procedure} arrival, {callsign_short}."

[[template]]
id = "center.maintain"
controller = "center"
text = ["{callsign}, maintain {altitude}, expect {approach} approach."]
readback = { required = ["altitude"] }
pilot_readback = "Maintain {altitude}, {callsign_short}."

[[template]]
id = "center.handoff_approach"
controller = "center"
text = ["{callsign}, contact {station} {frequency}."]
readback = { required = ["frequency"] }
pilot_readback = "{station} {frequency}, {callsign_short}."

# Crossing into the next sector enroute.
[[template]]
id = "center.handoff_center"
controller = "center"
text = ["{callsign}, contact {station} {frequency}.", "{callsign}, contact {station} on {frequency}, good day.",
        "{callsign}, contact {station} {frequency}, have a good one."]
readback = { required = ["frequency"] }
pilot_readback = "{station} {frequency}, {callsign_short}."

# --- dynamic routing (atc_core/routing.py) --------------------------------------------------------------------

# The route ahead through an active restricted area or TFR: vectors around it, then direct the fix beyond it.
[[template]]
id = "center.reroute"
controller = "center"
text = ["{callsign}, turn {turn} heading {heading}, {message}, when able proceed direct {fix}."]
readback = { required = ["heading"], optional = ["fix"] }
pilot_readback = "Turn {turn} heading {heading}, then direct {fix}, {callsign_short}."

# A deviation for weather going on a long time.
[[template]]
id = "center.advise_direct"
controller = "center"
text = ["{callsign}, advise when able to proceed direct {fix}."]

# Without a STAR: the descent with the arrival's crossing restriction.
[[template]]
id = "center.descend_cross"
controller = "center"
text = ["{callsign}, cross {fix} at {altitude}, descend at pilot's discretion, expect {approach} approach.",
        "{callsign}, descend at pilot's discretion, cross {fix} at {altitude}, expect {approach} approach."]
readback = { required = ["fix", "altitude"] }
pilot_readback = "Cross {fix} at {altitude}, pilot's discretion, {callsign_short}."
