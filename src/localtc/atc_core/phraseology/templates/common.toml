# Shared instructions and the fragments used to build corrections ("negative, ...")
# and read-back requests. {slot} names are typed in phraseology/slots.py.

[[template]]
id = "common.contact"
controller = "any"
text = ["{callsign}, contact {station} {frequency}."]
readback = { required = ["frequency"] }
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "common.say_again"
controller = "any"
text = ["{callsign}, say again."]

[[template]]
id = "common.station_say_again"
controller = "any"
text = ["Station calling {station}, say again your callsign."]

[[template]]
id = "common.readback_correct"
controller = "any"
text = ["{callsign}, readback correct."]

[[template]]
id = "common.roger"
controller = "any"
text = ["{callsign}, roger."]

[[template]]
id = "common.negative"
controller = "any"
text = ["{callsign}, negative, {correction}."]

[[template]]
id = "common.read_back"
controller = "any"
text = ["{callsign}, read back {missing}."]

[[template]]
id = "common.emergency"
controller = "any"
text = ["{callsign}, roger, say nature of emergency, fuel remaining and souls on board."]

[[template]]
id = "common.emergency_copied"
controller = "any"
text = ["{callsign}, roger, {message}. Say intentions."]

# Replies with no fixed wording: answers to questions ("altimeter 29.92") and declined requests.
# {message} is built by the engine from sim data, or worded by the language model and checked.
[[template]]
id = "common.info"
controller = "any"
text = ["{callsign}, {message}."]

[[template]]
id = "common.unable"
controller = "any"
text = ["{callsign}, unable."]

[[template]]
id = "common.climb"
controller = "any"
text = ["{callsign}, climb and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Climb and maintain {altitude}, {callsign_short}."

[[template]]
id = "common.descend"
controller = "any"
text = ["{callsign}, descend and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Descend and maintain {altitude}, {callsign_short}."

[[template]]
id = "common.maintain"
controller = "any"
text = ["{callsign}, maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Maintain {altitude}, {callsign_short}."

[[template]]
id = "common.say_altitude"
controller = "any"
text = ["{callsign}, say requested altitude."]

[fragments]
altitude = "maintain {altitude}"
cruise = "expect {cruise}"
frequency = "frequency {frequency}"
squawk = "squawk {squawk}"
runway = "runway {runway}"
hold_short = "hold short runway {hold_short}"
heading = "fly heading {heading}"
taxi_route = "taxi via {taxi_route}"
approach = "cleared {approach} approach"
destination = "cleared to {destination}"
cleared_for_takeoff = "cleared for takeoff"
line_up_and_wait = "line up and wait"
cleared_to_land = "cleared to land"
hold_position = "hold position"
