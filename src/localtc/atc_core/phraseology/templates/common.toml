# Shared instructions and the fragments used to build corrections ("negative, ...")
# and read-back requests. {slot} names are typed in phraseology/slots.py.

[[template]]
id = "common.contact"
controller = "any"
text = ["{callsign}, contact {station} {frequency}."]
readback = { required = ["frequency"] }
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "common.say_again"
controller = "any"
text = ["{callsign}, say again."]

[[template]]
id = "common.station_say_again"
controller = "any"
text = ["Station calling {station}, say again your callsign."]

[[template]]
id = "common.readback_correct"
controller = "any"
text = ["{callsign}, readback correct."]

[[template]]
id = "common.roger"
controller = "any"
text = ["{callsign}, roger."]

[[template]]
id = "common.negative"
controller = "any"
text = ["{callsign}, negative, {correction}."]

# A failure that isn't a mayday or pan-pan ("airspeed indicator failed, request the trucks").
[[template]]
id = "common.equipment"
controller = "any"
text = ["{callsign}, roger, emergency equipment will be standing by.", "{callsign}, roger, we'll have the equipment standing by."]

[[template]]
id = "common.problem"
controller = "any"
text = ["{callsign}, roger, advise if you need any assistance.", "{callsign}, roger, say if you need assistance."]

[[template]]
id = "common.affirmative"
controller = "any"
text = ["{callsign}, affirmative.", "{callsign}, affirm."]

[[template]]
id = "common.confirm"
controller = "any"
text = ["{callsign}, confirm {correction}."]

[[template]]
id = "common.read_back"
controller = "any"
text = ["{callsign}, read back {missing}."]

[[template]]
id = "common.emergency"
controller = "any"
text = ["{callsign}, roger, say nature of emergency, fuel remaining and souls on board."]

[[template]]
id = "common.emergency_copied"
controller = "any"
text = ["{callsign}, roger, {message}. Say intentions."]

# Replies with no fixed wording: answers to questions ("altimeter 29.92") and declined requests.
# {message} is built by the engine from sim data, or worded by the language model and checked.
[[template]]
id = "common.info"
controller = "any"
text = ["{callsign}, {message}."]

[[template]]
id = "common.unable"
controller = "any"
text = ["{callsign}, unable."]

[[template]]
id = "common.climb"
controller = "any"
text = ["{callsign}, climb and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Climb and maintain {altitude}, {callsign_short}."

[[template]]
id = "common.descend"
controller = "any"
text = ["{callsign}, descend and maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Descend and maintain {altitude}, {callsign_short}."

[[template]]
id = "common.maintain"
controller = "any"
text = ["{callsign}, maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Maintain {altitude}, {callsign_short}."

[[template]]
id = "common.say_altitude"
controller = "any"
text = ["{callsign}, say requested altitude."]

# --- unscripted moments ------------------------------------------------------------------------------

[[template]]
id = "common.direct"
controller = "any"
text = ["{callsign}, cleared direct {fix}.", "{callsign}, proceed direct {fix}."]
readback = { required = ["fix"] }
pilot_readback = "Direct {fix}, {callsign_short}."

[[template]]
id = "common.expect_runway"
controller = "any"
text = ["{callsign}, roger, expect runway {runway}."]
readback = { required = ["runway"] }
pilot_readback = "Expect runway {runway}, {callsign_short}."

[[template]]
id = "common.expect_approach"
controller = "any"
text = ["{callsign}, roger, expect {approach} approach."]
readback = { required = ["approach"] }
pilot_readback = "Expect {approach}, {callsign_short}."

[[template]]
id = "common.unable_runway"
controller = "any"
text = ["{callsign}, unable runway {runway}, wind {wind}."]

[[template]]
id = "common.return"
controller = "any"
text = ["{callsign}, roger, cleared direct {destination} airport, maintain {altitude}, expect {approach} approach."]
readback = { required = ["altitude"], optional = ["approach"] }
pilot_readback = "Direct {destination}, maintain {altitude}, {callsign_short}."

[[template]]
id = "common.pirep"
controller = "any"
text = ["{callsign}, roger, thanks for the report.", "{callsign}, thank you, I'll pass that along."]

[[template]]
id = "common.traffic"
controller = "any"
text = ["{callsign}, traffic, {message}."]

[[template]]
id = "common.check_altitude"
controller = "any"
text = ["{callsign}, check altitude, maintain {altitude}."]
readback = { required = ["altitude"] }
pilot_readback = "Maintain {altitude}, {callsign_short}."

[[template]]
id = "common.how_read"
controller = "any"
text = ["{callsign}, {station}, how do you read?", "{callsign}, did you copy?"]

[[template]]
id = "clearance.standby"
controller = "clearance"
text = ["{callsign}, clearance on request, stand by.", "{callsign}, stand by for your clearance."]

[fragments]
altitude = "maintain {altitude}"
cruise = "expect {cruise}"
frequency = "frequency {frequency}"
squawk = "squawk {squawk}"
runway = "runway {runway}"
hold_short = "hold short runway {hold_short}"
heading = "fly heading {heading}"
taxi_route = "taxi via {taxi_route}"
approach = "cleared {approach} approach"
procedure = "via the {procedure} departure"
destination = "cleared to {destination}"
cleared_for_takeoff = "cleared for takeoff"
line_up_and_wait = "line up and wait"
cleared_to_land = "cleared to land"
hold_position = "hold position"
fix = "direct {fix}"
