[[template]]
id = "ground.taxi_out"
controller = "ground"
text = ["{callsign}, runway {runway}, taxi via {taxi_route}.",
        "{callsign}, taxi to runway {runway} via {taxi_route}."]
readback = { required = ["runway"], optional = ["taxi_route"] }
pilot_readback = "Runway {runway}, taxi via {taxi_route}, {callsign_short}."

# The hold-short point named, as a controller does: "runway 25L at Delta, taxi via Charlie, Delta".
[[template]]
id = "ground.taxi_out_at"
controller = "ground"
text = ["{callsign}, runway {runway} at {hold_point}, taxi via {taxi_route}.",
        "{callsign}, taxi to runway {runway} at {hold_point} via {taxi_route}."]
readback = { required = ["runway"], optional = ["taxi_route"] }
pilot_readback = "Runway {runway} at {hold_point}, taxi via {taxi_route}, {callsign_short}."

[[template]]
id = "ground.taxi_out_hold_short"
controller = "ground"
text = ["{callsign}, runway {runway}, taxi via {taxi_route}, hold short runway {hold_short}.",
        "{callsign}, taxi to runway {runway} via {taxi_route}, hold short of runway {hold_short}."]
readback = { required = ["runway", "hold_short"], optional = ["taxi_route"] }
pilot_readback = "Runway {runway}, taxi via {taxi_route}, hold short runway {hold_short}, {callsign_short}."

[[template]]
id = "ground.taxi_out_no_route"
controller = "ground"
text = ["{callsign}, runway {runway}, taxi to the runway."]
readback = { required = ["runway"] }
pilot_readback = "Runway {runway}, {callsign_short}."

[[template]]
id = "ground.hold_position"
controller = "ground"
text = ["{callsign}, hold position, taxi clearance required."]
readback = { required = ["hold_position"] }
pilot_readback = "Holding position, {callsign_short}."

[[template]]
id = "ground.handoff_tower"
controller = "ground"
text = ["{callsign}, contact {station} {frequency}.",
        "{callsign}, contact {station} on {frequency}."]
readback = { required = ["frequency"] }
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "ground.taxi_in"
controller = "ground"
text = ["{callsign}, taxi to parking via {taxi_route}.",
        "{callsign}, taxi via {taxi_route} to parking."]
readback = { optional = ["taxi_route"] }
pilot_readback = "Taxi to parking via {taxi_route}, {callsign_short}."

# A GA flight, to the scenery's general aviation parking ("taxi to parking" said nothing of which ramp).
[[template]]
id = "ground.taxi_in_ramp"
controller = "ground"
text = ["{callsign}, taxi to the general aviation ramp via {taxi_route}.",
        "{callsign}, taxi via {taxi_route} to the GA ramp."]
readback = { optional = ["taxi_route"] }
pilot_readback = "Taxi to the GA ramp via {taxi_route}, {callsign_short}."

[[template]]
id = "ground.taxi_in_ramp_hold_short"
controller = "ground"
text = ["{callsign}, taxi to the general aviation ramp via {taxi_route}, hold short runway {hold_short}."]
readback = { required = ["hold_short"], optional = ["taxi_route"] }
pilot_readback = "Taxi to the GA ramp via {taxi_route}, hold short runway {hold_short}, {callsign_short}."

[[template]]
id = "ground.taxi_to_gate"
controller = "ground"
text = ["{callsign}, taxi to {gate} via {taxi_route}.", "{callsign}, {gate}, taxi via {taxi_route}."]
readback = { optional = ["taxi_route"] }
pilot_readback = "Taxi to {gate} via {taxi_route}, {callsign_short}."

# A runway on the way in: hold short of it, and the clearance to cross comes as the aircraft reaches it.
[[template]]
id = "ground.taxi_to_gate_hold_short"
controller = "ground"
text = ["{callsign}, taxi to {gate} via {taxi_route}, hold short runway {hold_short}.",
        "{callsign}, {gate}, taxi via {taxi_route}, hold short of runway {hold_short}."]
readback = { required = ["hold_short"], optional = ["taxi_route"] }
pilot_readback = "Taxi to {gate} via {taxi_route}, hold short runway {hold_short}, {callsign_short}."

[[template]]
id = "ground.taxi_in_hold_short"
controller = "ground"
text = ["{callsign}, taxi to parking via {taxi_route}, hold short runway {hold_short}."]
readback = { required = ["hold_short"], optional = ["taxi_route"] }
pilot_readback = "Taxi to parking via {taxi_route}, hold short runway {hold_short}, {callsign_short}."

[[template]]
id = "ground.taxi_cancelled"
controller = "ground"
text = ["{callsign}, roger, taxi clearance cancelled, hold position.", "{callsign}, roger, hold position."]

# Still at the gate, not ready after all: nothing to hold.
[[template]]
id = "ground.taxi_cancelled_ready"
controller = "ground"
text = ["{callsign}, roger, taxi clearance cancelled, advise when ready.", "{callsign}, roger, call me when you're ready."]

[[template]]
id = "ground.taxi_to_gate_no_route"
controller = "ground"
text = ["{callsign}, taxi to {gate}.", "{callsign}, {gate}, taxi via the apron."]
pilot_readback = "Taxi to {gate}, {callsign_short}."

[[template]]
id = "ground.taxi_in_no_route"
controller = "ground"
text = ["{callsign}, taxi to parking."]

# Push and start. The tail goes the way the aircraft will taxi, so the nose comes round facing it.
[[template]]
id = "ground.pushback"
controller = "ground"
text = ["{callsign}, push and start approved, tail {turn}.", "{callsign}, push and start at your discretion, tail {turn}."]

[[template]]
id = "ground.pushback_straight"
controller = "ground"
text = ["{callsign}, push and start approved.", "{callsign}, push and start at your discretion."]

# Start-up without a push (a GA ramp, a stand the aircraft taxis out of): "request engine start".
[[template]]
id = "ground.startup"
controller = "ground"
text = ["{callsign}, start up approved, advise ready to taxi.", "{callsign}, start at your discretion, advise ready to taxi."]

# A runway the taxi route crosses: the clearance to cross it comes as the aircraft reaches it.
[[template]]
id = "ground.cross_runway"
controller = "ground"
text = ["{callsign}, cross runway {runway}.", "{callsign}, cross runway {runway}, remain this frequency."]
readback = { required = ["runway"] }
pilot_readback = "Cross runway {runway}, {callsign_short}."

# Another aircraft in the way on the ground.
[[template]]
id = "ground.stopped_ahead"
controller = "ground"
text = ["{callsign}, caution, {message} stopped on the taxiway ahead of you.", "{callsign}, hold position, there's {message} stopped ahead of you on the taxiway."]

[[template]]
id = "ground.give_way"
controller = "ground"
text = ["{callsign}, hold position, give way to the {message}.", "{callsign}, give way to the {message}, then continue taxi."]

# Traffic taxiing to the same runway, joining the way ahead: one call, not a caution for each aircraft in the line.
[[template]]
id = "ground.follow"
controller = "ground"
text = ["{callsign}, give way to the {message}, then follow it.", "{callsign}, follow the {message}."]
