text = ["{callsign}, drehen Sie {turn} Steuerkurs {heading}, Radarführung zum {approach} Anflug."]
pilot_readback = "Steuerkurs {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, drehen Sie {turn} Steuerkurs {heading}.", "{callsign}, fliegen Sie Steuerkurs {heading}."]
pilot_readback = "Steuerkurs {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, verstanden, erwarten Sie Sichtanflug Piste {runway}, Radarführung zum Endanflug."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, behalten Sie den gegenwärtigen Kurs bei, Radarführung zum {approach} Anflug."]
pilot_readback = "Gegenwärtigen Kurs beibehalten, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, fliegen Sie Steuerkurs {heading}."]
pilot_readback = "Steuerkurs {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
text = ["{callsign}, Steuerkurs {heading}, sinken Sie {altitude}."]
pilot_readback = "Steuerkurs {heading}, sinken {altitude}, {callsign_short}."

