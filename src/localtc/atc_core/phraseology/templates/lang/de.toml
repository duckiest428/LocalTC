# German radiotelephony (the DFS's German phraseology). The same ids as the English templates, reworded; what's read
# back is the same. A pilot's readback here is read through tongues/de.py's lexicon.

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, sinken Sie {altitude}, erwarten Sie {approach} Anflug.",
        "{callsign}, {station}, erwarten Sie {approach} Anflug, sinken Sie {altitude}."]
pilot_readback = "Sinken {altitude}, erwarten {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, erwarten Sie {approach} Anflug."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, verstanden.", "{callsign}, {station}, guten Tag."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, verstanden, erwarten Sie Radarführung zum {approach} Anflug."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, halten Sie {altitude}, erwarten Sie {approach} Anflug."]
pilot_readback = "Halten {altitude}, erwarten {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, freigegeben zum Anflug {approach}, rufen Sie {station} {frequency}."]
pilot_readback = "Freigegeben zum Anflug {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, starten Sie durch, Sie haben keine Landefreigabe, fliegen Sie Pistenrichtung, steigen Sie {altitude}."]
pilot_readback = "Starten durch, Pistenrichtung, steigen {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, Radarkontakt, halten Sie {altitude}, erwarten Sie Radarführung zu einem neuen {approach} Anflug."]
pilot_readback = "Halten {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, Steuerkurs {heading}, Radarführung zum {approach} Anflug."]
pilot_readback = "Steuerkurs {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, verstanden, fliegen Sie Pistenrichtung, steigen Sie {altitude}."]
pilot_readback = "Pistenrichtung, steigen {altitude}, {callsign_short}."

[[template]]
