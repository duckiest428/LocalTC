text = ["{callsign}, drehen Sie {turn} Steuerkurs {heading}, freigegeben zum Anflug {approach}."]
pilot_readback = "Drehen {turn} Steuerkurs {heading}, freigegeben zum Anflug {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, kein Verkehr bekannt, Wind {wind}, Frequenzwechsel genehmigt."]
pilot_readback = "Frequenzwechsel, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, kein Verkehr bekannt, Wind {wind}, rufen Sie {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, rufen Sie {station} {frequency}.", "{callsign}, kontaktieren Sie {station} auf {frequency}, tschüss."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, drehen Sie {turn} Steuerkurs {heading}, fangen Sie den Endanflugkurs, {approach} Anflug."]
pilot_readback = "Steuerkurs {heading} zum Auffangen, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, reduzieren Sie Geschwindigkeit {speed} Knoten."]
pilot_readback = "{speed} Knoten, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, freigegeben zum Anflug {approach}."]
pilot_readback = "Freigegeben zum Anflug {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, sinken Sie {altitude}, freigegeben zum Anflug {approach}."]
pilot_readback = "Sinken {altitude}, freigegeben zum Anflug {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend_tower"
text = ["{callsign}, sinken Sie {altitude}, freigegeben zum Anflug {approach}, rufen Sie {station} {frequency} wenn etabliert."]
pilot_readback = "Sinken {altitude}, freigegeben zum Anflug {approach}, {station} {frequency} wenn etabliert, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, weiter sinken {altitude}, erwarten Sie {approach} Anflug."]
pilot_readback = "Weiter sinken {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, halten Sie {speed} Knoten bis fünf Meilen Endanflug."]
pilot_readback = "{speed} Knoten bis fünf Meilen Endanflug, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, Sie sind {message}.", "{callsign}, {message}, die Radarführung ist für die Staffelung."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, verlängern Sie den Gegenanflug, {message}, ich rufe Sie für den Queranflug."]

[[template]]
id = "approach.sidestep"
text = ["{callsign}, Wechsel auf Piste {runway} genehmigt."]
pilot_readback = "Wechsel auf Piste {runway}, {callsign_short}."

[[template]]
id = "approach.weather_change"
