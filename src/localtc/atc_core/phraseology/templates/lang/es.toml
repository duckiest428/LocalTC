pilot_readback = "Viramos a la {turn} rumbo {heading}, {callsign_short}."

[[template]]
id = "approach.intercept_cleared"
text = ["{callsign}, vire a la {turn} rumbo {heading}, mantenga {altitude} hasta establecido en el localizador, autorizado aproximación {approach}."]
pilot_readback = "Viramos a la {turn} rumbo {heading}, mantenemos {altitude} hasta establecidos, autorizados aproximación {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_course"
text = ["{callsign}, vire a la {turn} rumbo {heading}, mantenga {altitude} hasta establecido en el curso de aproximación final, autorizado aproximación {approach}."]
pilot_readback = "Viramos a la {turn} rumbo {heading}, mantenemos {altitude} hasta establecidos, autorizados aproximación {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_visual"
text = ["{callsign}, vire a la {turn} rumbo {heading}, autorizado aproximación {approach}."]
pilot_readback = "Viramos a la {turn} rumbo {heading}, autorizados aproximación {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, sin tráfico reportado, viento {wind}, cambio de frecuencia aprobado."]
pilot_readback = "Cambio de frecuencia, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, sin tráfico reportado, viento {wind}, contacte {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, contacte {station} {frequency}.", "{callsign}, contacte {station} en {frequency}, buen vuelo."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, vire a la {turn} rumbo {heading}, intercepte el curso de aproximación final, aproximación {approach}."]
pilot_readback = "Rumbo {heading} para interceptar, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, reduzca velocidad {speed} nudos."]
pilot_readback = "{speed} nudos, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, autorizado aproximación {approach}."]
pilot_readback = "Autorizados aproximación {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, descienda {altitude}, autorizado aproximación {approach}."]
pilot_readback = "Descendemos {altitude}, autorizados aproximación {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend_tower"
text = ["{callsign}, descienda {altitude}, autorizado aproximación {approach}, contacte {station} {frequency} cuando esté establecido."]
pilot_readback = "Descendemos {altitude}, autorizados aproximación {approach}, {station} {frequency} cuando establecidos, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, continúe el descenso {altitude}, prevea aproximación {approach}."]
pilot_readback = "Continuamos el descenso {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, mantenga {speed} nudos hasta cinco millas en final."]
pilot_readback = "{speed} nudos hasta cinco millas en final, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, es usted {message}.", "{callsign}, {message}, los vectores son para la secuencia."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, extienda el tramo de viento en cola, {message}, le aviso para el tramo base."]

[[template]]
id = "approach.sidestep"
text = ["{callsign}, cambio a la pista {runway} aprobado."]
pilot_readback = "Cambio a la pista {runway}, {callsign_short}."

[[template]]
id = "approach.weather_change"
text = ["{callsign}, el tiempo está por debajo de los mínimos visuales, prevea aproximación {approach}."]
pilot_readback = "Prevemos {approach}, {callsign_short}."

