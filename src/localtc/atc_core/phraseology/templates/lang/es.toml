# Spanish radiotelephony (ENAIRE's, and Latin America's). The same ids as the English templates, reworded; what's
# read back is the same. A pilot's readback here is read through tongues/es.py's lexicon.

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, descienda y mantenga {altitude}, prevea aproximación {approach}.",
        "{callsign}, {station}, prevea aproximación {approach}, descienda {altitude}."]
pilot_readback = "Descendemos y mantenemos {altitude}, prevemos {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, prevea aproximación {approach}."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, recibido.", "{callsign}, {station}, buenos días."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, recibido, prevea vectores para la aproximación {approach}."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, mantenga {altitude}, prevea aproximación {approach}."]
pilot_readback = "Mantenemos {altitude}, prevemos {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, autorizado aproximación {approach}, contacte {station} {frequency}."]
pilot_readback = "Autorizados aproximación {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, motor y al aire, no tiene autorización de aterrizaje, mantenga rumbo de pista, ascienda y mantenga {altitude}."]
pilot_readback = "Motor y al aire, rumbo de pista, ascendemos y mantenemos {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, contacto radar, mantenga {altitude}, prevea vectores para otra aproximación {approach}."]
pilot_readback = "Mantenemos {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, rumbo {heading}, vectores para la aproximación {approach}."]
pilot_readback = "Rumbo {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, recibido, mantenga rumbo de pista, ascienda y mantenga {altitude}."]
pilot_readback = "Rumbo de pista, ascendemos y mantenemos {altitude}, {callsign_short}."

[[template]]
id = "approach.turn"
text = ["{callsign}, vire a la {turn} rumbo {heading}, vectores para la aproximación {approach}."]
pilot_readback = "Rumbo {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, vire a la {turn} rumbo {heading}.", "{callsign}, vuele rumbo {heading}."]
pilot_readback = "Rumbo {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, recibido, prevea la aproximación visual pista {runway}, vectores a final."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, mantenga el rumbo actual, vectores para la aproximación {approach}."]
pilot_readback = "Rumbo actual, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, vuele rumbo {heading}."]
pilot_readback = "Rumbo {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
text = ["{callsign}, rumbo {heading}, descienda y mantenga {altitude}."]
pilot_readback = "Rumbo {heading}, descendemos y mantenemos {altitude}, {callsign_short}."

[[template]]
id = "approach.turn_descend"
