pilot_readback = "Viramos a la {turn} rumbo {heading}, descendemos y mantenemos {altitude}, {callsign_short}."

[[template]]
id = "approach.downwind"
text = ["{callsign}, vire a la {turn} rumbo {heading}, vectores para la aproximación {approach}."]
pilot_readback = "Rumbo {heading}, {callsign_short}."

[[template]]
