# --- clearance ----------------------------------------------------------------------------------------------------

[[template]]
id = "clearance.ifr"
text = ["{callsign}, autorizado a {destination} según plan de vuelo{runway_note}, ascienda y mantenga {altitude}, prevea {cruise} {minutes} minutos después de la salida, frecuencia de salidas {frequency}, transpondedor {squawk}."]
pilot_readback = "Autorizados a {destination} según plan de vuelo, ascendemos y mantenemos {altitude}, prevemos {cruise} {minutes} minutos después de la salida, salidas {frequency}, transpondedor {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_at_cruise"
text = ["{callsign}, autorizado a {destination} según plan de vuelo{runway_note}, ascienda y mantenga {altitude}, frecuencia de salidas {frequency}, transpondedor {squawk}."]
pilot_readback = "Autorizados a {destination} según plan de vuelo, ascendemos y mantenemos {altitude}, salidas {frequency}, transpondedor {squawk}, {callsign_short}."

[[template]]
id = "clearance.say_destination"
text = ["{callsign}, indique su destino y el nivel solicitado."]

[[template]]
id = "clearance.ifr_sid"
text = ["{callsign}, autorizado a {destination}, salida {procedure}, luego según plan de vuelo{runway_note}, ascienda y mantenga {altitude}, prevea {cruise} {minutes} minutos después de la salida, frecuencia de salidas {frequency}, transpondedor {squawk}."]
pilot_readback = "Autorizados a {destination}, salida {procedure}, luego según plan de vuelo, ascendemos y mantenemos {altitude}, prevemos {cruise} {minutes} minutos después de la salida, salidas {frequency}, transpondedor {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_sid_at_cruise"
text = ["{callsign}, autorizado a {destination}, salida {procedure}, luego según plan de vuelo{runway_note}, ascienda y mantenga {altitude}, frecuencia de salidas {frequency}, transpondedor {squawk}."]
pilot_readback = "Autorizados a {destination}, salida {procedure}, luego según plan de vuelo, ascendemos y mantenemos {altitude}, salidas {frequency}, transpondedor {squawk}, {callsign_short}."

[[template]]
id = "clearance.readback_correct_ground"
text = ["{callsign}, colación correcta, contacte {station} {frequency} cuando esté listo.",
        "{callsign}, colación correcta. Listo para remolque y puesta en marcha, contacte {station} en {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "clearance.standby"
text = ["{callsign}, autorización solicitada, mantenga escucha.", "{callsign}, aguarde su autorización."]

