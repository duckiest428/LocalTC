# --- clearance ----------------------------------------------------------------------------------------------------

[[template]]
id = "clearance.ifr"
text = ["{callsign}, autorisé à destination de {destination} selon le plan de vol déposé{runway_note}, montez et maintenez {altitude}, prévoyez {cruise} {minutes} minutes après le départ, fréquence départ {frequency}, transpondeur {squawk}."]
pilot_readback = "Autorisés à destination de {destination} selon le plan de vol, montons et maintenons {altitude}, prévoyons {cruise} {minutes} minutes après le départ, départ {frequency}, transpondeur {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_at_cruise"
text = ["{callsign}, autorisé à destination de {destination} selon le plan de vol déposé{runway_note}, montez et maintenez {altitude}, fréquence départ {frequency}, transpondeur {squawk}."]
pilot_readback = "Autorisés à destination de {destination} selon le plan de vol, montons et maintenons {altitude}, départ {frequency}, transpondeur {squawk}, {callsign_short}."

[[template]]
id = "clearance.say_destination"
text = ["{callsign}, indiquez votre destination et le niveau demandé."]

[[template]]
id = "clearance.ifr_sid"
text = ["{callsign}, autorisé à destination de {destination}, départ {procedure}, puis selon le plan de vol{runway_note}, montez et maintenez {altitude}, prévoyez {cruise} {minutes} minutes après le départ, fréquence départ {frequency}, transpondeur {squawk}."]
pilot_readback = "Autorisés à destination de {destination}, départ {procedure}, puis selon le plan de vol, montons et maintenons {altitude}, prévoyons {cruise} {minutes} minutes après le départ, départ {frequency}, transpondeur {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_sid_at_cruise"
text = ["{callsign}, autorisé à destination de {destination}, départ {procedure}, puis selon le plan de vol{runway_note}, montez et maintenez {altitude}, fréquence départ {frequency}, transpondeur {squawk}."]
pilot_readback = "Autorisés à destination de {destination}, départ {procedure}, puis selon le plan de vol, montons et maintenons {altitude}, départ {frequency}, transpondeur {squawk}, {callsign_short}."

[[template]]
id = "clearance.readback_correct_ground"
text = ["{callsign}, collationnement correct, contactez {station} {frequency} quand vous serez prêt.",
        "{callsign}, collationnement correct. Prêt pour la mise en route, contactez {station} sur {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "clearance.standby"
text = ["{callsign}, clairance en cours de demande, restez à l'écoute.", "{callsign}, attendez pour votre clairance."]

