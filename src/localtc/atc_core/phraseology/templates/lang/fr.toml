# French radiotelephony (the DGAC's phraseology). The same ids as the English templates, reworded; what's read back
# is the same. A pilot's readback here is read through tongues/fr.py's lexicon.

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, descendez et maintenez {altitude}, prévoyez une approche {approach}.",
        "{callsign}, {station}, prévoyez une approche {approach}, descendez {altitude}."]
pilot_readback = "Descendons et maintenons {altitude}, prévoyons approche {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, prévoyez une approche {approach}."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, bien reçu.", "{callsign}, {station}, bonjour."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, bien reçu, prévoyez un guidage pour l'approche {approach}."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, maintenez {altitude}, prévoyez une approche {approach}."]
pilot_readback = "Maintenons {altitude}, prévoyons approche {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, autorisé approche {approach}, contactez {station} {frequency}."]
pilot_readback = "Autorisés approche {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, remettez les gaz, vous n'êtes pas autorisé à l'atterrissage, maintenez le cap de la piste, montez et maintenez {altitude}."]
pilot_readback = "Remise de gaz, cap de la piste, montons et maintenons {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, identifié radar, maintenez {altitude}, prévoyez un guidage pour une nouvelle approche {approach}."]
pilot_readback = "Maintenons {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, cap {heading}, guidage pour l'approche {approach}."]
pilot_readback = "Cap {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, bien reçu, maintenez le cap de la piste, montez et maintenez {altitude}."]
pilot_readback = "Cap de la piste, montons et maintenons {altitude}, {callsign_short}."

[[template]]
id = "approach.turn"
text = ["{callsign}, virez à {turn} cap {heading}, guidage pour l'approche {approach}."]
pilot_readback = "Cap {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, virez à {turn} cap {heading}.", "{callsign}, prenez le cap {heading}."]
pilot_readback = "Cap {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, bien reçu, prévoyez l'approche à vue piste {runway}, guidage vers la finale."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, maintenez le cap actuel, guidage pour l'approche {approach}."]
pilot_readback = "Cap actuel, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, prenez le cap {heading}."]
pilot_readback = "Cap {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
text = ["{callsign}, cap {heading}, descendez et maintenez {altitude}."]
pilot_readback = "Cap {heading}, descendons et maintenons {altitude}, {callsign_short}."

[[template]]
id = "approach.turn_descend"
text = ["{callsign}, virez à {turn} cap {heading}, descendez et maintenez {altitude}."]
pilot_readback = "Virons à {turn} cap {heading}, descendons et maintenons {altitude}, {callsign_short}."

[[template]]
id = "approach.downwind"
text = ["{callsign}, virez à {turn} cap {heading}, guidage pour l'approche {approach}."]
pilot_readback = "Cap {heading}, {callsign_short}."

[[template]]
id = "approach.base"
text = ["{callsign}, virez à {turn} cap {heading}.", "{callsign}, virez à {turn} cap {heading}, guidage vers la finale."]
pilot_readback = "Virons à {turn} cap {heading}, {callsign_short}."

[[template]]
id = "approach.intercept_cleared"
text = ["{callsign}, virez à {turn} cap {heading}, maintenez {altitude} jusqu'à l'établissement sur le localizer, autorisé approche {approach}."]
pilot_readback = "Virons à {turn} cap {heading}, maintenons {altitude} jusqu'à établis, autorisés approche {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_course"
text = ["{callsign}, virez à {turn} cap {heading}, maintenez {altitude} jusqu'à l'établissement sur l'axe d'approche finale, autorisé approche {approach}."]
pilot_readback = "Virons à {turn} cap {heading}, maintenons {altitude} jusqu'à établis, autorisés approche {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_visual"
text = ["{callsign}, virez à {turn} cap {heading}, autorisé approche {approach}."]
pilot_readback = "Virons à {turn} cap {heading}, autorisés approche {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, pas de trafic signalé, vent {wind}, changement de fréquence approuvé."]
pilot_readback = "Changement de fréquence, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, pas de trafic signalé, vent {wind}, contactez {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, contactez {station} {frequency}.", "{callsign}, contactez {station} sur {frequency}, au revoir."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, virez à {turn} cap {heading}, interceptez l'axe d'approche finale, approche {approach}."]
pilot_readback = "Cap {heading} pour intercepter, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, réduisez vitesse {speed} nœuds."]
pilot_readback = "Vitesse {speed} nœuds, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, autorisé approche {approach}."]
pilot_readback = "Autorisés approche {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, descendez {altitude}, autorisé approche {approach}."]
pilot_readback = "Descendons {altitude}, autorisés approche {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend_tower"
text = ["{callsign}, descendez {altitude}, autorisé approche {approach}, contactez {station} {frequency} une fois établi."]
pilot_readback = "Descendons {altitude}, autorisés approche {approach}, {station} {frequency} une fois établis, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, poursuivez la descente {altitude}, prévoyez une approche {approach}."]
pilot_readback = "Poursuivons la descente {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, maintenez {speed} nœuds jusqu'à cinq nautiques en finale."]
pilot_readback = "{speed} nœuds jusqu'à cinq nautiques en finale, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, vous êtes {message}.", "{callsign}, {message}, le guidage est pour la séquence."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, prolongez la vent arrière, {message}, je vous rappelle pour la base."]

[[template]]
id = "approach.sidestep"
text = ["{callsign}, décalage vers la piste {runway} approuvé."]
pilot_readback = "Décalage piste {runway}, {callsign_short}."

[[template]]
id = "approach.weather_change"
text = ["{callsign}, la météo est passée sous les minima à vue, prévoyez une approche {approach}."]
pilot_readback = "Prévoyons approche {approach}, {callsign_short}."

