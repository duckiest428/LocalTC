text = ["{callsign}, autorizzato a {destination}, partenza {procedure}, poi come da piano di volo{runway_note}, salga e mantenga {altitude}, preveda {cruise} {minutes} minuti dopo la partenza, frequenza partenze {frequency}, transponder {squawk}."]
pilot_readback = "Autorizzati a {destination}, partenza {procedure}, poi come da piano di volo, saliamo e manteniamo {altitude}, prevediamo {cruise} {minutes} minuti dopo la partenza, partenze {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_sid_at_cruise"
text = ["{callsign}, autorizzato a {destination}, partenza {procedure}, poi come da piano di volo{runway_note}, salga e mantenga {altitude}, frequenza partenze {frequency}, transponder {squawk}."]
pilot_readback = "Autorizzati a {destination}, partenza {procedure}, poi come da piano di volo, saliamo e manteniamo {altitude}, partenze {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.readback_correct_ground"
text = ["{callsign}, collazione corretta, contatti {station} {frequency} quando pronto.",
        "{callsign}, collazione corretta. Pronto per pushback e messa in moto, contatti {station} su {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "clearance.standby"
text = ["{callsign}, autorizzazione richiesta, rimanga in ascolto.", "{callsign}, rimanga in ascolto per la sua autorizzazione."]

