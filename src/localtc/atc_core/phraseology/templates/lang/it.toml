# --- clearance ----------------------------------------------------------------------------------------------------

[[template]]
id = "clearance.ifr"
text = ["{callsign}, autorizzato a {destination} come da piano di volo{runway_note}, salga e mantenga {altitude}, preveda {cruise} {minutes} minuti dopo la partenza, frequenza partenze {frequency}, transponder {squawk}."]
pilot_readback = "Autorizzati a {destination} come da piano di volo, saliamo e manteniamo {altitude}, prevediamo {cruise} {minutes} minuti dopo la partenza, partenze {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_at_cruise"
text = ["{callsign}, autorizzato a {destination} come da piano di volo{runway_note}, salga e mantenga {altitude}, frequenza partenze {frequency}, transponder {squawk}."]
