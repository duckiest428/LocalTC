# Italian radiotelephony (ENAV's). The same ids as the English templates, reworded; what's read back is the same. A
# pilot's readback here is read through tongues/it.py's lexicon.

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, scenda e mantenga {altitude}, preveda avvicinamento {approach}.",
        "{callsign}, {station}, preveda avvicinamento {approach}, scenda {altitude}."]
pilot_readback = "Scendiamo e manteniamo {altitude}, prevediamo {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, preveda avvicinamento {approach}."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, ricevuto.", "{callsign}, {station}, buongiorno."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, ricevuto, preveda vettori per l'avvicinamento {approach}."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, mantenga {altitude}, preveda avvicinamento {approach}."]
pilot_readback = "Manteniamo {altitude}, prevediamo {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, autorizzato avvicinamento {approach}, contatti {station} {frequency}."]
pilot_readback = "Autorizzati avvicinamento {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, riattacchi, non è autorizzato all'atterraggio, mantenga prua pista, salga e mantenga {altitude}."]
pilot_readback = "Riattacchiamo, prua pista, saliamo e manteniamo {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, contatto radar, mantenga {altitude}, preveda vettori per un nuovo avvicinamento {approach}."]
pilot_readback = "Manteniamo {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, prua {heading}, vettori per l'avvicinamento {approach}."]
pilot_readback = "Prua {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, ricevuto, mantenga prua pista, salga e mantenga {altitude}."]
pilot_readback = "Prua pista, saliamo e manteniamo {altitude}, {callsign_short}."

[[template]]
id = "approach.turn"
text = ["{callsign}, viri a {turn} prua {heading}, vettori per l'avvicinamento {approach}."]
pilot_readback = "Prua {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, viri a {turn} prua {heading}.", "{callsign}, prua {heading}."]
pilot_readback = "Prua {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, ricevuto, preveda l'avvicinamento a vista pista {runway}, vettori per il finale."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, mantenga la prua attuale, vettori per l'avvicinamento {approach}."]
pilot_readback = "Prua attuale, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, prua {heading}."]
pilot_readback = "Prua {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
text = ["{callsign}, prua {heading}, scenda e mantenga {altitude}."]
pilot_readback = "Prua {heading}, scendiamo e manteniamo {altitude}, {callsign_short}."

[[template]]
id = "approach.turn_descend"
text = ["{callsign}, viri a {turn} prua {heading}, scenda e mantenga {altitude}."]
pilot_readback = "Viriamo a {turn} prua {heading}, scendiamo e manteniamo {altitude}, {callsign_short}."

[[template]]
id = "approach.downwind"
text = ["{callsign}, viri a {turn} prua {heading}, vettori per l'avvicinamento {approach}."]
pilot_readback = "Prua {heading}, {callsign_short}."

[[template]]
id = "approach.base"
text = ["{callsign}, viri a {turn} prua {heading}.", "{callsign}, viri a {turn} prua {heading}, vettori per il finale."]
pilot_readback = "Viriamo a {turn} prua {heading}, {callsign_short}."

[[template]]
id = "approach.intercept_cleared"
text = ["{callsign}, viri a {turn} prua {heading}, mantenga {altitude} fino a stabilizzato sul localizzatore, autorizzato avvicinamento {approach}."]
pilot_readback = "Viriamo a {turn} prua {heading}, manteniamo {altitude} fino a stabilizzati, autorizzati avvicinamento {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_course"
text = ["{callsign}, viri a {turn} prua {heading}, mantenga {altitude} fino a stabilizzato sulla rotta di avvicinamento finale, autorizzato avvicinamento {approach}."]
pilot_readback = "Viriamo a {turn} prua {heading}, manteniamo {altitude} fino a stabilizzati, autorizzati avvicinamento {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_visual"
text = ["{callsign}, viri a {turn} prua {heading}, autorizzato avvicinamento {approach}."]
pilot_readback = "Viriamo a {turn} prua {heading}, autorizzati avvicinamento {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, nessun traffico riportato, vento {wind}, cambio frequenza approvato."]
pilot_readback = "Cambio frequenza, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, nessun traffico riportato, vento {wind}, contatti {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, contatti {station} {frequency}.", "{callsign}, contatti {station} su {frequency}, buona giornata."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, viri a {turn} prua {heading}, intercetti la rotta di avvicinamento finale, avvicinamento {approach}."]
pilot_readback = "Prua {heading} per intercettare, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, riduca velocità {speed} nodi."]
pilot_readback = "{speed} nodi, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, autorizzato avvicinamento {approach}."]
pilot_readback = "Autorizzati avvicinamento {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, scenda {altitude}, autorizzato avvicinamento {approach}."]
pilot_readback = "Scendiamo {altitude}, autorizzati avvicinamento {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend_tower"
text = ["{callsign}, scenda {altitude}, autorizzato avvicinamento {approach}, contatti {station} {frequency} quando stabilizzato."]
pilot_readback = "Scendiamo {altitude}, autorizzati avvicinamento {approach}, {station} {frequency} quando stabilizzati, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, continui la discesa {altitude}, preveda avvicinamento {approach}."]
pilot_readback = "Continuiamo la discesa {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, mantenga {speed} nodi fino a cinque miglia in finale."]
pilot_readback = "{speed} nodi fino a cinque miglia in finale, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, siete {message}.", "{callsign}, {message}, i vettori sono per la sequenza."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, estenda il sottovento, {message}, la chiamo per la base."]

[[template]]
id = "approach.sidestep"
text = ["{callsign}, cambio sulla pista {runway} approvato."]
pilot_readback = "Cambio sulla pista {runway}, {callsign_short}."

[[template]]
id = "approach.weather_change"
text = ["{callsign}, il tempo è sotto i minimi a vista, preveda avvicinamento {approach}."]
pilot_readback = "Prevediamo {approach}, {callsign_short}."

