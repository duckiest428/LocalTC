pilot_readback = "Kruisen {fix} op {altitude}, naar eigen inzicht, {callsign_short}."

# --- clearance ----------------------------------------------------------------------------------------------------

[[template]]
id = "clearance.ifr"
text = ["{callsign}, vrijgegeven naar {destination} volgens vliegplan{runway_note}, klim naar {altitude}, verwacht {cruise} {minutes} minuten na vertrek, vertrekfrequentie {frequency}, transponder {squawk}."]
pilot_readback = "Vrijgegeven naar {destination} volgens vliegplan, klimmen naar {altitude}, verwachten {cruise} {minutes} minuten na vertrek, vertrek {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_at_cruise"
text = ["{callsign}, vrijgegeven naar {destination} volgens vliegplan{runway_note}, klim naar {altitude}, vertrekfrequentie {frequency}, transponder {squawk}."]
pilot_readback = "Vrijgegeven naar {destination} volgens vliegplan, klimmen naar {altitude}, vertrek {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.say_destination"
text = ["{callsign}, meld uw bestemming en het gewenste niveau."]

[[template]]
id = "clearance.ifr_sid"
text = ["{callsign}, vrijgegeven naar {destination}, vertrekroute {procedure}, daarna volgens vliegplan{runway_note}, klim naar {altitude}, verwacht {cruise} {minutes} minuten na vertrek, vertrekfrequentie {frequency}, transponder {squawk}."]
pilot_readback = "Vrijgegeven naar {destination}, vertrekroute {procedure}, daarna volgens vliegplan, klimmen naar {altitude}, verwachten {cruise} {minutes} minuten na vertrek, vertrek {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_sid_at_cruise"
text = ["{callsign}, vrijgegeven naar {destination}, vertrekroute {procedure}, daarna volgens vliegplan{runway_note}, klim naar {altitude}, vertrekfrequentie {frequency}, transponder {squawk}."]
pilot_readback = "Vrijgegeven naar {destination}, vertrekroute {procedure}, daarna volgens vliegplan, klimmen naar {altitude}, vertrek {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.readback_correct_ground"
text = ["{callsign}, teruglezing correct, neem contact op met {station} {frequency} wanneer gereed.",
        "{callsign}, teruglezing correct. Gereed voor pushback en opstarten, neem contact op met {station} op {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "clearance.standby"
text = ["{callsign}, klaring aangevraagd, stand-by.", "{callsign}, stand-by voor uw klaring."]

