# Dutch radiotelephony (LVNL's Dutch phraseology). The same ids as the English templates, reworded; what's read back
# is the same. A pilot's readback here is read through tongues/nl.py's lexicon.

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, daal naar {altitude}, verwacht {approach} nadering.",
        "{callsign}, {station}, verwacht {approach} nadering, daal naar {altitude}."]
pilot_readback = "Dalen naar {altitude}, verwachten {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, verwacht {approach} nadering."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, begrepen.", "{callsign}, {station}, goedemiddag."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, begrepen, verwacht radarvectoren voor de {approach} nadering."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, handhaaf {altitude}, verwacht {approach} nadering."]
pilot_readback = "Handhaven {altitude}, verwachten {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, vrij voor nadering {approach}, neem contact op met {station} {frequency}."]
pilot_readback = "Vrij voor nadering {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, start door, u heeft geen landingsklaring, vlieg baankoers, klim naar {altitude}."]
pilot_readback = "Starten door, baankoers, klimmen naar {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, radarcontact, handhaaf {altitude}, verwacht radarvectoren voor een nieuwe {approach} nadering."]
pilot_readback = "Handhaven {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, koers {heading}, radarvectoren voor de {approach} nadering."]
pilot_readback = "Koers {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, begrepen, vlieg baankoers, klim naar {altitude}."]
pilot_readback = "Baankoers, klimmen naar {altitude}, {callsign_short}."

[[template]]
id = "approach.turn"
text = ["{callsign}, draai {turn} koers {heading}, radarvectoren voor de {approach} nadering."]
pilot_readback = "Koers {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, draai {turn} koers {heading}.", "{callsign}, vlieg koers {heading}."]
pilot_readback = "Koers {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, begrepen, verwacht zichtnadering baan {runway}, radarvectoren naar de eindnadering."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, handhaaf de huidige koers, radarvectoren voor de {approach} nadering."]
pilot_readback = "Huidige koers, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, vlieg koers {heading}."]
pilot_readback = "Koers {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
text = ["{callsign}, koers {heading}, daal naar {altitude}."]
pilot_readback = "Koers {heading}, dalen naar {altitude}, {callsign_short}."

[[template]]
id = "approach.turn_descend"
text = ["{callsign}, draai {turn} koers {heading}, daal naar {altitude}."]
pilot_readback = "Draaien {turn} koers {heading}, dalen naar {altitude}, {callsign_short}."

[[template]]
id = "approach.downwind"
text = ["{callsign}, draai {turn} koers {heading}, radarvectoren voor de {approach} nadering."]
pilot_readback = "Koers {heading}, {callsign_short}."

[[template]]
id = "approach.base"
text = ["{callsign}, draai {turn} koers {heading}.", "{callsign}, draai {turn} koers {heading}, radarvectoren naar de eindnadering."]
pilot_readback = "Draaien {turn} koers {heading}, {callsign_short}."

[[template]]
id = "approach.intercept_cleared"
text = ["{callsign}, draai {turn} koers {heading}, handhaaf {altitude} tot gevestigd op de localizer, vrij voor nadering {approach}."]
pilot_readback = "Draaien {turn} koers {heading}, handhaven {altitude} tot gevestigd, vrij voor nadering {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_course"
text = ["{callsign}, draai {turn} koers {heading}, handhaaf {altitude} tot gevestigd op de eindnaderingskoers, vrij voor nadering {approach}."]
pilot_readback = "Draaien {turn} koers {heading}, handhaven {altitude} tot gevestigd, vrij voor nadering {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_visual"
text = ["{callsign}, draai {turn} koers {heading}, vrij voor nadering {approach}."]
pilot_readback = "Draaien {turn} koers {heading}, vrij voor nadering {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, geen verkeer bekend, wind {wind}, frequentiewissel goedgekeurd."]
pilot_readback = "Frequentiewissel, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, geen verkeer bekend, wind {wind}, neem contact op met {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, neem contact op met {station} {frequency}.", "{callsign}, neem contact op met {station} op {frequency}, goede vlucht."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, draai {turn} koers {heading}, onderschep de eindnaderingskoers, {approach} nadering."]
pilot_readback = "Koers {heading} om te onderscheppen, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, verminder snelheid naar {speed} knopen."]
pilot_readback = "{speed} knopen, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, vrij voor nadering {approach}."]
pilot_readback = "Vrij voor nadering {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, daal naar {altitude}, vrij voor nadering {approach}."]
pilot_readback = "Dalen naar {altitude}, vrij voor nadering {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend_tower"
text = ["{callsign}, daal naar {altitude}, vrij voor nadering {approach}, neem contact op met {station} {frequency} wanneer gevestigd."]
pilot_readback = "Dalen naar {altitude}, vrij voor nadering {approach}, {station} {frequency} wanneer gevestigd, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, vervolg de daling naar {altitude}, verwacht {approach} nadering."]
pilot_readback = "Vervolgen de daling naar {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, handhaaf {speed} knopen tot vijf mijl eindnadering."]
pilot_readback = "{speed} knopen tot vijf mijl eindnadering, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, u bent {message}.", "{callsign}, {message}, de vectoren zijn voor de volgorde."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, verleng het benedenwindse been, {message}, ik roep u voor de base."]

[[template]]
id = "approach.sidestep"
text = ["{callsign}, wissel naar baan {runway} goedgekeurd."]
pilot_readback = "Wissel naar baan {runway}, {callsign_short}."

[[template]]
id = "approach.weather_change"
text = ["{callsign}, het weer is onder de zichtminima, verwacht {approach} nadering."]
pilot_readback = "Verwachten {approach}, {callsign_short}."

