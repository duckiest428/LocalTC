pilot_readback = "Wanneer gereed dalen naar {altitude}, vrij voor aankomstroute {procedure}, {callsign_short}."

[[template]]
id = "center.checkin_descend_star"
text = ["{callsign}, {station}, begrepen, vervolg de daling naar {altitude}, aankomstroute {procedure}."]
pilot_readback = "Vervolgen de daling naar {altitude}, aankomstroute {procedure}, {callsign_short}."

[[template]]
id = "center.maintain"
text = ["{callsign}, handhaaf {altitude}, verwacht {approach} nadering."]
pilot_readback = "Handhaven {altitude}, {callsign_short}."

[[template]]
id = "center.handoff_approach"
text = ["{callsign}, neem contact op met {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "center.handoff_center"
