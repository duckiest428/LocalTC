text = ["{callsign}, zezwolenie do {destination} zgodnie z planem lotu{runway_note}, wznoś się do {altitude}, spodziewaj się {cruise} {minutes} minut po odlocie, częstotliwość odlotu {frequency}, kod transpondera {squawk}."]
pilot_readback = "Zezwolenie do {destination} zgodnie z planem lotu, wznosimy się do {altitude}, spodziewamy się {cruise} {minutes} minut po odlocie, odlot {frequency}, kod {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_at_cruise"
text = ["{callsign}, zezwolenie do {destination} zgodnie z planem lotu{runway_note}, wznoś się do {altitude}, częstotliwość odlotu {frequency}, kod transpondera {squawk}."]
pilot_readback = "Zezwolenie do {destination} zgodnie z planem lotu, wznosimy się do {altitude}, odlot {frequency}, kod {squawk}, {callsign_short}."

[[template]]
id = "clearance.say_destination"
text = ["{callsign}, podaj lotnisko docelowe i żądany poziom."]

[[template]]
id = "clearance.ifr_sid"
text = ["{callsign}, zezwolenie do {destination}, odlot {procedure}, następnie zgodnie z planem lotu{runway_note}, wznoś się do {altitude}, spodziewaj się {cruise} {minutes} minut po odlocie, częstotliwość odlotu {frequency}, kod transpondera {squawk}."]
pilot_readback = "Zezwolenie do {destination}, odlot {procedure}, następnie zgodnie z planem lotu, wznosimy się do {altitude}, spodziewamy się {cruise} {minutes} minut po odlocie, odlot {frequency}, kod {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_sid_at_cruise"
text = ["{callsign}, zezwolenie do {destination}, odlot {procedure}, następnie zgodnie z planem lotu{runway_note}, wznoś się do {altitude}, częstotliwość odlotu {frequency}, kod transpondera {squawk}."]
pilot_readback = "Zezwolenie do {destination}, odlot {procedure}, następnie zgodnie z planem lotu, wznosimy się do {altitude}, odlot {frequency}, kod {squawk}, {callsign_short}."

[[template]]
id = "clearance.readback_correct_ground"
text = ["{callsign}, odczyt poprawny, kontaktuj {station} {frequency} gdy gotowy.",
