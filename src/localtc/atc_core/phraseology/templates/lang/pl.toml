# Polish radiotelephony (PAŻP's Polish phraseology). The same ids as the English templates, reworded; what's read
# back is the same. A pilot's readback here is read through tongues/pl.py's lexicon.

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, zniżaj się do {altitude}, spodziewaj się podejścia {approach}.",
        "{callsign}, {station}, spodziewaj się podejścia {approach}, zniżaj się do {altitude}."]
pilot_readback = "Zniżamy się do {altitude}, spodziewamy się {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, spodziewaj się podejścia {approach}."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, przyjąłem.", "{callsign}, {station}, dzień dobry."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, przyjąłem, spodziewaj się wektorów do podejścia {approach}."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, utrzymuj {altitude}, spodziewaj się podejścia {approach}."]
pilot_readback = "Utrzymujemy {altitude}, spodziewamy się {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, zezwalam na podejście {approach}, kontaktuj {station} {frequency}."]
pilot_readback = "Zezwolenie na podejście {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, odejdź na drugi krąg, nie masz zezwolenia na lądowanie, utrzymuj kurs pasa, wznoś się do {altitude}."]
pilot_readback = "Odchodzimy na drugi krąg, kurs pasa, wznosimy się do {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, kontakt radarowy, utrzymuj {altitude}, spodziewaj się wektorów do kolejnego podejścia {approach}."]
pilot_readback = "Utrzymujemy {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, kurs {heading}, wektory do podejścia {approach}."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, przyjąłem, utrzymuj kurs pasa, wznoś się do {altitude}."]
pilot_readback = "Kurs pasa, wznosimy się do {altitude}, {callsign_short}."

[[template]]
id = "approach.turn"
text = ["{callsign}, skręć w {turn} kurs {heading}, wektory do podejścia {approach}."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, skręć w {turn} kurs {heading}.", "{callsign}, leć kursem {heading}."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, przyjąłem, spodziewaj się podejścia z widocznością pas {runway}, wektory na prostą."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, utrzymuj obecny kurs, wektory do podejścia {approach}."]
pilot_readback = "Obecny kurs, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, leć kursem {heading}."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
text = ["{callsign}, kurs {heading}, zniżaj się do {altitude}."]
pilot_readback = "Kurs {heading}, zniżamy się do {altitude}, {callsign_short}."

[[template]]
id = "approach.turn_descend"
text = ["{callsign}, skręć w {turn} kurs {heading}, zniżaj się do {altitude}."]
pilot_readback = "Skręcamy w {turn} kurs {heading}, zniżamy się do {altitude}, {callsign_short}."

[[template]]
id = "approach.downwind"
text = ["{callsign}, skręć w {turn} kurs {heading}, wektory do podejścia {approach}."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.base"
text = ["{callsign}, skręć w {turn} kurs {heading}.", "{callsign}, skręć w {turn} kurs {heading}, wektory na prostą."]
pilot_readback = "Skręcamy w {turn} kurs {heading}, {callsign_short}."

[[template]]
id = "approach.intercept_cleared"
text = ["{callsign}, skręć w {turn} kurs {heading}, utrzymuj {altitude} do ustabilizowania na localizerze, zezwalam na podejście {approach}."]
pilot_readback = "Skręcamy w {turn} kurs {heading}, utrzymujemy {altitude} do ustabilizowania, zezwolenie na podejście {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_course"
text = ["{callsign}, skręć w {turn} kurs {heading}, utrzymuj {altitude} do ustabilizowania na kursie podejścia końcowego, zezwalam na podejście {approach}."]
pilot_readback = "Skręcamy w {turn} kurs {heading}, utrzymujemy {altitude} do ustabilizowania, zezwolenie na podejście {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_visual"
text = ["{callsign}, skręć w {turn} kurs {heading}, zezwalam na podejście {approach}."]
pilot_readback = "Skręcamy w {turn} kurs {heading}, zezwolenie na podejście {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, brak zgłoszonego ruchu, wiatr {wind}, zmiana częstotliwości zatwierdzona."]
pilot_readback = "Zmiana częstotliwości, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, brak zgłoszonego ruchu, wiatr {wind}, kontaktuj {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, kontaktuj {station} {frequency}.", "{callsign}, kontaktuj {station} na {frequency}, do usłyszenia."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, skręć w {turn} kurs {heading}, przechwyć kurs podejścia końcowego, podejście {approach}."]
pilot_readback = "Kurs {heading} do przechwycenia, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, zmniejsz prędkość do {speed} węzłów."]
pilot_readback = "{speed} węzłów, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, zezwalam na podejście {approach}."]
pilot_readback = "Zezwolenie na podejście {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, zniżaj się do {altitude}, zezwalam na podejście {approach}."]
pilot_readback = "Zniżamy się do {altitude}, zezwolenie na podejście {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend_tower"
text = ["{callsign}, zniżaj się do {altitude}, zezwalam na podejście {approach}, kontaktuj {station} {frequency} po ustabilizowaniu."]
pilot_readback = "Zniżamy się do {altitude}, zezwolenie na podejście {approach}, {station} {frequency} po ustabilizowaniu, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, kontynuuj zniżanie do {altitude}, spodziewaj się podejścia {approach}."]
pilot_readback = "Kontynuujemy zniżanie do {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, utrzymuj {speed} węzłów do pięciu mil na prostej."]
pilot_readback = "{speed} węzłów do 5 mil na prostej, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, jesteś {message}.", "{callsign}, {message}, wektory są dla sekwencji."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, przedłuż odcinek z wiatrem, {message}, zawołam cię do zakrętu."]

[[template]]
id = "approach.sidestep"
text = ["{callsign}, zmiana na pas {runway} zatwierdzona."]
pilot_readback = "Zmiana na pas {runway}, {callsign_short}."

[[template]]
id = "approach.weather_change"
text = ["{callsign}, pogoda spadła poniżej minimów z widocznością, spodziewaj się podejścia {approach}."]
pilot_readback = "Spodziewamy się {approach}, {callsign_short}."

