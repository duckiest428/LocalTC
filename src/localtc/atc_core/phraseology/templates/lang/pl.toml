[[template]]
id = "vfr.straight_in"
text = ["{callsign}, {station}, podejście z prostej pas {runway}, zgłoś trzy mile na prostej."]
pilot_readback = "Z prostej pas {runway}, {callsign_short}."

[[template]]
id = "vfr.option"
text = ["{callsign}, pas {runway}, wiatr {wind}, zezwalam na opcję."]
pilot_readback = "Zezwolenie na opcję pas {runway}, {callsign_short}."

[[template]]
id = "vfr.touch_and_go"
text = ["{callsign}, pas {runway}, wiatr {wind}, zezwalam na touch and go."]
pilot_readback = "Zezwolenie na touch and go pas {runway}, {callsign_short}."

[[template]]
id = "vfr.following_ground"
text = ["{callsign}, kod transpondera {squawk}, częstotliwość odlotu {frequency}."]
pilot_readback = "Kod {squawk}, odlot {frequency}, {callsign_short}."

[[template]]
id = "vfr.transition"
text = ["{callsign}, przelot zatwierdzony {direction}, utrzymuj VFR na lub poniżej {altitude}, zgłoś opuszczenie strefy."]
pilot_readback = "Przelot zatwierdzony, na lub poniżej {altitude}, wilco, {callsign_short}."

