# Portuguese radiotelephony (NAV Portugal's). The same ids as the English templates, reworded; what's read back is
# the same. A pilot's readback here is read through tongues/pt.py's lexicon (which knows Brazil's words too).

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, desça e mantenha {altitude}, preveja aproximação {approach}.",
        "{callsign}, {station}, preveja aproximação {approach}, desça {altitude}."]
pilot_readback = "Descemos e mantemos {altitude}, prevemos {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, preveja aproximação {approach}."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, recebido.", "{callsign}, {station}, bom dia."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, recebido, preveja vetores para a aproximação {approach}."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, mantenha {altitude}, preveja aproximação {approach}."]
pilot_readback = "Mantemos {altitude}, prevemos {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, autorizado aproximação {approach}, contacte {station} {frequency}."]
pilot_readback = "Autorizados aproximação {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, faça borrego, não está autorizado a aterrar, mantenha rumo da pista, suba e mantenha {altitude}."]
pilot_readback = "Borrego, rumo da pista, subimos e mantemos {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, contacto radar, mantenha {altitude}, preveja vetores para nova aproximação {approach}."]
pilot_readback = "Mantemos {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, rumo {heading}, vetores para a aproximação {approach}."]
pilot_readback = "Rumo {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, recebido, mantenha rumo da pista, suba e mantenha {altitude}."]
pilot_readback = "Rumo da pista, subimos e mantemos {altitude}, {callsign_short}."

[[template]]
id = "approach.turn"
text = ["{callsign}, vire à {turn} rumo {heading}, vetores para a aproximação {approach}."]
pilot_readback = "Rumo {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, vire à {turn} rumo {heading}.", "{callsign}, voe rumo {heading}."]
pilot_readback = "Rumo {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, recebido, preveja a aproximação visual pista {runway}, vetores para final."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, mantenha o rumo atual, vetores para a aproximação {approach}."]
pilot_readback = "Rumo atual, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, voe rumo {heading}."]
pilot_readback = "Rumo {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
text = ["{callsign}, rumo {heading}, desça e mantenha {altitude}."]
pilot_readback = "Rumo {heading}, descemos e mantemos {altitude}, {callsign_short}."

[[template]]
id = "approach.turn_descend"
text = ["{callsign}, vire à {turn} rumo {heading}, desça e mantenha {altitude}."]
pilot_readback = "Viramos à {turn} rumo {heading}, descemos e mantemos {altitude}, {callsign_short}."

[[template]]
id = "approach.downwind"
text = ["{callsign}, vire à {turn} rumo {heading}, vetores para a aproximação {approach}."]
pilot_readback = "Rumo {heading}, {callsign_short}."

[[template]]
id = "approach.base"
text = ["{callsign}, vire à {turn} rumo {heading}.", "{callsign}, vire à {turn} rumo {heading}, vetores para final."]
pilot_readback = "Viramos à {turn} rumo {heading}, {callsign_short}."

[[template]]
id = "approach.intercept_cleared"
text = ["{callsign}, vire à {turn} rumo {heading}, mantenha {altitude} até estabelecido no localizador, autorizado aproximação {approach}."]
pilot_readback = "Viramos à {turn} rumo {heading}, mantemos {altitude} até estabelecidos, autorizados aproximação {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_course"
text = ["{callsign}, vire à {turn} rumo {heading}, mantenha {altitude} até estabelecido no curso de aproximação final, autorizado aproximação {approach}."]
pilot_readback = "Viramos à {turn} rumo {heading}, mantemos {altitude} até estabelecidos, autorizados aproximação {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_visual"
text = ["{callsign}, vire à {turn} rumo {heading}, autorizado aproximação {approach}."]
pilot_readback = "Viramos à {turn} rumo {heading}, autorizados aproximação {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, sem tráfego reportado, vento {wind}, mudança de frequência aprovada."]
pilot_readback = "Mudança de frequência, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, sem tráfego reportado, vento {wind}, contacte {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, contacte {station} {frequency}.", "{callsign}, contacte {station} em {frequency}, bom voo."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, vire à {turn} rumo {heading}, intercete o curso de aproximação final, aproximação {approach}."]
pilot_readback = "Rumo {heading} para intercetar, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, reduza velocidade {speed} nós."]
pilot_readback = "{speed} nós, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, autorizado aproximação {approach}."]
pilot_readback = "Autorizados aproximação {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, desça {altitude}, autorizado aproximação {approach}."]
pilot_readback = "Descemos {altitude}, autorizados aproximação {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend_tower"
text = ["{callsign}, desça {altitude}, autorizado aproximação {approach}, contacte {station} {frequency} quando estabelecido."]
pilot_readback = "Descemos {altitude}, autorizados aproximação {approach}, {station} {frequency} quando estabelecidos, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, continue a descida {altitude}, preveja aproximação {approach}."]
pilot_readback = "Continuamos a descida {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, mantenha {speed} nós até cinco milhas em final."]
pilot_readback = "{speed} nós até cinco milhas em final, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, é o {message}.", "{callsign}, {message}, os vetores são para a sequência."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, estenda a perna do vento, {message}, chamo-o para a base."]

[[template]]
id = "approach.sidestep"
text = ["{callsign}, mudança para a pista {runway} aprovada."]
pilot_readback = "Mudança para a pista {runway}, {callsign_short}."

[[template]]
id = "approach.weather_change"
text = ["{callsign}, o tempo está abaixo dos mínimos visuais, preveja aproximação {approach}."]
pilot_readback = "Prevemos {approach}, {callsign_short}."

