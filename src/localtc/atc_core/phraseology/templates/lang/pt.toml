# --- clearance ----------------------------------------------------------------------------------------------------

[[template]]
id = "clearance.ifr"
text = ["{callsign}, autorizado para {destination} conforme plano de voo{runway_note}, suba e mantenha {altitude}, preveja {cruise} {minutes} minutos após a partida, frequência de partidas {frequency}, transponder {squawk}."]
pilot_readback = "Autorizados para {destination} conforme plano de voo, subimos e mantemos {altitude}, prevemos {cruise} {minutes} minutos após a partida, partidas {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_at_cruise"
text = ["{callsign}, autorizado para {destination} conforme plano de voo{runway_note}, suba e mantenha {altitude}, frequência de partidas {frequency}, transponder {squawk}."]
pilot_readback = "Autorizados para {destination} conforme plano de voo, subimos e mantemos {altitude}, partidas {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.say_destination"
text = ["{callsign}, indique o destino e o nível solicitado."]

[[template]]
id = "clearance.ifr_sid"
text = ["{callsign}, autorizado para {destination}, saída {procedure}, depois conforme plano de voo{runway_note}, suba e mantenha {altitude}, preveja {cruise} {minutes} minutos após a partida, frequência de partidas {frequency}, transponder {squawk}."]
pilot_readback = "Autorizados para {destination}, saída {procedure}, depois conforme plano de voo, subimos e mantemos {altitude}, prevemos {cruise} {minutes} minutos após a partida, partidas {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_sid_at_cruise"
text = ["{callsign}, autorizado para {destination}, saída {procedure}, depois conforme plano de voo{runway_note}, suba e mantenha {altitude}, frequência de partidas {frequency}, transponder {squawk}."]
pilot_readback = "Autorizados para {destination}, saída {procedure}, depois conforme plano de voo, subimos e mantemos {altitude}, partidas {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.readback_correct_ground"
text = ["{callsign}, colação correta, contacte {station} {frequency} quando pronto.",
        "{callsign}, colação correta. Pronto para pushback e arranque, contacte {station} em {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "clearance.standby"
text = ["{callsign}, autorização pedida, mantenha escuta.", "{callsign}, mantenha escuta para a sua autorização."]

