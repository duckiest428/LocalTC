text = ["{callsign}, {turn} разворотом курс {heading}, векторение на заход {approach}."]
pilot_readback = "Курс {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, {turn} разворотом курс {heading}.", "{callsign}, следуйте курсом {heading}."]
pilot_readback = "Курс {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, понял, рассчитывайте визуальный заход полоса {runway}, векторение на посадочную прямую."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, сохраняйте текущий курс, векторение на заход {approach}."]
pilot_readback = "Текущий курс, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, следуйте курсом {heading}."]
pilot_readback = "Курс {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
