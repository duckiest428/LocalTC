pilot_readback = "{turn} разворотом курс {heading}, сохраняем {altitude} до установились, разрешили заход {approach}, {callsign_short}."

[[template]]
id = "approach.intercept_visual"
text = ["{callsign}, {turn} разворотом курс {heading}, разрешаю заход {approach}."]
pilot_readback = "{turn} разворотом курс {heading}, разрешили заход {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, движения не наблюдаю, ветер {wind}, смену частоты разрешаю."]
pilot_readback = "Смена частоты, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, движения не наблюдаю, ветер {wind}, работайте с {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, работайте с {station} {frequency}.", "{callsign}, работайте с {station} на {frequency}, до свидания."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, {turn} разворотом курс {heading}, выходите на конечный курс захода, заход {approach}."]
pilot_readback = "Курс {heading} для выхода, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, уменьшите скорость {speed} узлов."]
pilot_readback = "{speed} узлов, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, разрешаю заход {approach}."]
pilot_readback = "Разрешили заход {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, снижайтесь {altitude}, разрешаю заход {approach}."]
pilot_readback = "Снижаемся {altitude}, разрешили заход {approach}, {callsign_short}."

[[template]]
