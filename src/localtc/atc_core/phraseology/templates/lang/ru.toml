# Russian radiotelephony. The same ids as the English templates, reworded; what's read back is the same. A pilot's
# readback here is read through tongues/ru.py's lexicon.

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, снижайтесь {altitude}, рассчитывайте заход {approach}.",
        "{callsign}, {station}, рассчитывайте заход {approach}, снижайтесь {altitude}."]
pilot_readback = "Снижаемся {altitude}, рассчитываем {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, рассчитывайте заход {approach}."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, понял.", "{callsign}, {station}, добрый день."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, понял, рассчитывайте векторение на заход {approach}."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, сохраняйте {altitude}, рассчитывайте заход {approach}."]
pilot_readback = "Сохраняем {altitude}, рассчитываем {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, разрешаю заход {approach}, работайте с {station} {frequency}."]
pilot_readback = "Разрешили заход {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, уходите на второй круг, посадка вам не разрешена, курс взлёта, набирайте {altitude}."]
pilot_readback = "Уходим на второй круг, курс взлёта, набираем {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, наблюдаю вас, сохраняйте {altitude}, рассчитывайте векторение на повторный заход {approach}."]
pilot_readback = "Сохраняем {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, курс {heading}, векторение на заход {approach}."]
pilot_readback = "Курс {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, понял, курс взлёта, набирайте {altitude}."]
pilot_readback = "Курс взлёта, набираем {altitude}, {callsign_short}."

[[template]]
