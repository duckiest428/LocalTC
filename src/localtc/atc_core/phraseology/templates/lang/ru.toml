[[template]]
id = "vfr.squawk"
text = ["{callsign}, код ответчика {squawk}."]
pilot_readback = "Код {squawk}, {callsign_short}."

[[template]]
id = "vfr.radar_contact"
text = ["{callsign}, {station}, наблюдаю вас, {message}."]

[[template]]
id = "vfr.cleared_class_b"
text = ["{callsign}, разрешаю вход в воздушное пространство класса Bravo, по ПВП на или ниже {altitude}."]
pilot_readback = "Вход в Bravo, по ПВП на или ниже {altitude}, {callsign_short}."

[[template]]
id = "vfr.remain_clear_b"
text = ["{callsign}, оставайтесь вне воздушного пространства класса Bravo."]

[[template]]
id = "vfr.service_terminated"
text = ["{callsign}, радиолокационное обслуживание прекращаю, код ПВП, работайте с {station} {frequency}."]
pilot_readback = "Код ПВП, {station} {frequency}, {callsign_short}."

[[template]]
id = "vfr.enter_downwind"
text = ["{callsign}, {station}, входите в третий {turn} разворотами полоса {runway}, доложите середину третьего."]
pilot_readback = "Третий {turn} разворотами полоса {runway}, {callsign_short}."

[[template]]
id = "vfr.straight_in"
text = ["{callsign}, {station}, заход с прямой на полосу {runway}, доложите три мили на прямой."]
pilot_readback = "С прямой на полосу {runway}, {callsign_short}."

[[template]]
id = "vfr.option"
text = ["{callsign}, полоса {runway}, ветер {wind}, разрешаю по выбору."]
pilot_readback = "Разрешили по выбору полоса {runway}, {callsign_short}."

[[template]]
id = "vfr.touch_and_go"
text = ["{callsign}, полоса {runway}, ветер {wind}, разрешаю касание."]
pilot_readback = "Разрешили касание полоса {runway}, {callsign_short}."

[[template]]
id = "vfr.following_ground"
text = ["{callsign}, код ответчика {squawk}, частота вылета {frequency}."]
pilot_readback = "Код {squawk}, вылет {frequency}, {callsign_short}."

[[template]]
id = "vfr.transition"
text = ["{callsign}, транзит {direction} разрешаю, по ПВП на или ниже {altitude}, доложите выход из зоны."]
pilot_readback = "Транзит разрешили, на или ниже {altitude}, wilco, {callsign_short}."

