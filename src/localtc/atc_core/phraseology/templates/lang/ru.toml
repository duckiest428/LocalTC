[[template]]
id = "clearance.ifr_at_cruise"
text = ["{callsign}, разрешено до {destination} по плану{runway_note}, набирайте {altitude}, частота вылета {frequency}, код ответчика {squawk}."]
pilot_readback = "Разрешили до {destination} по плану, набираем {altitude}, вылет {frequency}, код {squawk}, {callsign_short}."

[[template]]
