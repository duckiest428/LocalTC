pilot_readback = "Снижаемся {altitude}, разрешили заход {approach}, {station} {frequency} после выхода на курс, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, продолжайте снижение {altitude}, рассчитывайте заход {approach}."]
pilot_readback = "Продолжаем снижение {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, сохраняйте {speed} узлов до пяти миль на посадочной прямой."]
pilot_readback = "{speed} узлов до 5 миль на посадочной прямой, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, вы {message}.", "{callsign}, {message}, векторение для очерёдности."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, продлите третий, {message}, четвёртый по моей команде."]

[[template]]
