pilot_readback = "Klar till {destination} enligt färdplan, stiger till {altitude}, räknar med {cruise} {minutes} minuter efter avgång, utflygning {frequency}, transponder {squawk}, {callsign_short}."

[[template]]
id = "clearance.ifr_at_cruise"
text = ["{callsign}, klar till {destination} enligt färdplan{runway_note}, stig till {altitude}, utflygningsfrekvens {frequency}, transponder {squawk}."]
