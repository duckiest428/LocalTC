pilot_readback = "Svänger {turn} kurs {heading}, klar för inflygning {approach}, {callsign_short}."

[[template]]
id = "approach.advisory"
text = ["{callsign}, ingen rapporterad trafik, vind {wind}, frekvensbyte godkänt."]
pilot_readback = "Frekvensbyte, {callsign_short}."

[[template]]
id = "approach.handoff_radio"
text = ["{callsign}, ingen rapporterad trafik, vind {wind}, kontakta {station} {frequency}."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.handoff_tower"
text = ["{callsign}, kontakta {station} {frequency}.", "{callsign}, kontakta {station} på {frequency}, hej då."]
pilot_readback = "{station} {frequency}, {callsign_short}."

[[template]]
id = "approach.intercept"
text = ["{callsign}, sväng {turn} kurs {heading}, genskär slutlig inflygningskurs, {approach} inflygning."]
pilot_readback = "Kurs {heading} för att genskära, {callsign_short}."

[[template]]
id = "approach.speed"
text = ["{callsign}, minska fart till {speed} knop."]
pilot_readback = "{speed} knop, {callsign_short}."

[[template]]
id = "approach.cleared_star"
text = ["{callsign}, klar för inflygning {approach}."]
pilot_readback = "Klar för inflygning {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend"
text = ["{callsign}, sjunk till {altitude}, klar för inflygning {approach}."]
pilot_readback = "Sjunker till {altitude}, klar för inflygning {approach}, {callsign_short}."

[[template]]
id = "approach.cleared_star_descend_tower"
text = ["{callsign}, sjunk till {altitude}, klar för inflygning {approach}, kontakta {station} {frequency} när etablerad."]
pilot_readback = "Sjunker till {altitude}, klar för inflygning {approach}, {station} {frequency} när etablerade, {callsign_short}."

[[template]]
id = "approach.checkin_descend_star"
text = ["{callsign}, {station}, fortsätt sjunkningen till {altitude}, räkna med {approach} inflygning."]
pilot_readback = "Fortsätter sjunkningen till {altitude}, {callsign_short}."

[[template]]
id = "approach.speed_until"
text = ["{callsign}, bibehåll {speed} knop till fem mil final."]
pilot_readback = "{speed} knop till fem mil final, {callsign_short}."

[[template]]
id = "approach.sequence"
text = ["{callsign}, ni är {message}.", "{callsign}, {message}, vektorerna är för sekvensen."]

[[template]]
id = "approach.extend_downwind"
text = ["{callsign}, förläng medvinden, {message}, jag anropar er för basen."]

[[template]]
id = "approach.sidestep"
text = ["{callsign}, byte till bana {runway} godkänt."]
pilot_readback = "Byte till bana {runway}, {callsign_short}."

[[template]]
id = "approach.weather_change"
text = ["{callsign}, vädret är under visuella minima, räkna med {approach} inflygning."]
pilot_readback = "Räknar med {approach}, {callsign_short}."

