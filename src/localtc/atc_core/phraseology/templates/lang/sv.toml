# Swedish radiotelephony (LFV's Swedish phraseology). The same ids as the English templates, reworded; what's read
# back is the same. A pilot's readback here is read through tongues/sv.py's lexicon.

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, sjunk till {altitude}, räkna med {approach} inflygning.",
        "{callsign}, {station}, räkna med {approach} inflygning, sjunk till {altitude}."]
pilot_readback = "Sjunker till {altitude}, räknar med {approach}, {callsign_short}."

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, räkna med {approach} inflygning."]

[[template]]
id = "approach.checkin_roger"
text = ["{callsign}, {station}, uppfattat.", "{callsign}, {station}, god dag."]

[[template]]
id = "approach.checkin_vectors"
text = ["{callsign}, {station}, uppfattat, räkna med radarvektorer för {approach} inflygning."]

[[template]]
id = "approach.maintain"
text = ["{callsign}, {station}, bibehåll {altitude}, räkna med {approach} inflygning."]
pilot_readback = "Bibehåller {altitude}, räknar med {approach}, {callsign_short}."

[[template]]
id = "approach.cleared"
text = ["{callsign}, klar för inflygning {approach}, kontakta {station} {frequency}."]
pilot_readback = "Klar för inflygning {approach}, {station} {frequency}, {callsign_short}."

[[template]]
id = "approach.go_around_no_clearance"
text = ["{callsign}, gör om, ni har ingen landningsklarering, flyg banans kurs, stig till {altitude}."]
pilot_readback = "Går om, banans kurs, stiger till {altitude}, {callsign_short}."

[[template]]
id = "approach.go_around_checkin"
text = ["{callsign}, {station}, radarkontakt, bibehåll {altitude}, räkna med radarvektorer för en ny {approach} inflygning."]
pilot_readback = "Bibehåller {altitude}, {callsign_short}."

[[template]]
id = "approach.vectors"
text = ["{callsign}, kurs {heading}, radarvektorer för {approach} inflygning."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.missed"
text = ["{callsign}, uppfattat, flyg banans kurs, stig till {altitude}."]
pilot_readback = "Banans kurs, stiger till {altitude}, {callsign_short}."

[[template]]
id = "approach.turn"
text = ["{callsign}, sväng {turn} kurs {heading}, radarvektorer för {approach} inflygning."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.heading"
text = ["{callsign}, sväng {turn} kurs {heading}.", "{callsign}, flyg kurs {heading}."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.expect_visual"
text = ["{callsign}, uppfattat, räkna med visuell inflygning bana {runway}, radarvektorer till final."]

[[template]]
id = "approach.present_heading"
text = ["{callsign}, behåll nuvarande kurs, radarvektorer för {approach} inflygning."]
pilot_readback = "Nuvarande kurs, {callsign_short}."

[[template]]
id = "approach.fly_heading"
text = ["{callsign}, flyg kurs {heading}."]
pilot_readback = "Kurs {heading}, {callsign_short}."

[[template]]
id = "approach.heading_descend"
text = ["{callsign}, kurs {heading}, sjunk till {altitude}."]
pilot_readback = "Kurs {heading}, sjunker till {altitude}, {callsign_short}."

[[template]]
