# Mandarin radiotelephony (the CAAC's). The same ids as the English templates, reworded; what's read back is the same.
# A pilot's readback here is read through tongues/zh.py's lexicon. (The callsign is followed by ", " as in every
# language: the engine finds where the instruction starts by it.)

# --- approach -----------------------------------------------------------------------------------------------------

[[template]]
id = "approach.descend"
text = ["{callsign}, {station}, 下降到{altitude}保持, 预计{approach}进近。", "{callsign}, {station}, 预计{approach}进近, 下降到{altitude}。"]
pilot_readback = "下降到{altitude}保持, 预计{approach}, {callsign_short}。"

[[template]]
id = "approach.checkin_descend_via"
text = ["{callsign}, {station}, 预计{approach}进近。"]

[[template]]
id = "approach.checkin_roger"
