# The MSFS 2024 stock Airbus A320neo. Detents by handle index; "1+F" is config 1 on the ground (the same handle).
# Speeds from the A320 limitations: VFE per configuration, VLO/VLE for the gear.
[aircraft]
name = "Airbus A320neo"
match = ["A320", "A20N", "A321", "A21N", "A319", "A19N"]
flaps = "detents"        # FLAPS_UP, FLAPS_1, FLAPS_2, FLAPS_3, FLAPS_DOWN
detents = ["up", "1", "2", "3", "full"]
aliases = { "one plus f" = "1", "1 plus f" = "1", "1+f" = "1", "config full" = "full", "zero" = "up", "0" = "up" }
vfe = [0, 230, 200, 185, 177]   # knots, 0: no limit
gear_extend_kt = 250            # VLO extension
gear_retract_kt = 220           # VLO retraction
gear_extended_kt = 280          # VLE
first_detent_ground = "1+F"     # how "flaps 1" is said on the ground: the slats and flaps of config 1+F
speed_check_kt = 100            # "one hundred knots" on the takeoff roll
rollout_call_kt = 70            # "seventy knots" on the landing roll
vmo_kt = 350
spoilers = true                 # ground spoilers: armed before takeoff and landing, "spoilers" on touchdown
landing_detent = "3"            # config 3 or full
# AUTO BRAKE SWITCH CB 0-3 as the A320 family's buttons (as FlyByWire's A32NX counts them; not yet checked in the
# stock aircraft: if the copilot names the wrong one, correct it here).
autobrake = ["off", "low", "medium", "max"]
reversers = true
ceiling_ft = 39000              # the A320's certified ceiling (39,800 ft)
short_runway_ft = 7000

# Any action can be sent another way for this aircraft: a key event other than the standard one, or an L:var.
# [actions.seatbelt_sign]
# lvar = "L:XMLVAR_SWITCH_OVHD_INTLT_SEATBELT_Position"
# on = 1
# off = 0

# MSFS 2024: the FCU ignores the autopilot key events (AP_ALT_VAR_SET_ENGLISH, AP_SPD_VAR_SET); its knobs are input
# events that move one step each time they're set (+1/-1), so they're turned until the reading gets there. Checked
# against the FCU's windows in the stock A320neo V2 (2026-10-08). The altitude knob goes in thousands.
[actions.heading]
knob = "INSTRUMENT_FCU_HDG_KNOB"

[actions.speed]
knob = "INSTRUMENT_FCU_SPD_KNOB"

[actions.altitude]
knob = "INSTRUMENT_FCU_ALT_KNOB"
step = 1000
