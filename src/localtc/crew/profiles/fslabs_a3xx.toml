# The FSLabs A319/A320/A321 (MSFS 2024). Its systems are its own: the sim's key events don't move its switches, and
# the sim's flap handle, light and autopilot variables don't follow them. Its cockpit's clickspots do: each one sends
# K:ROTOR_BRAKE with its own code (the code in the aircraft's ModelBehaviorDefs, +1 for a step up, +0 for a step down;
# a button +0 pressed, +2 released), and its own L:vars read the switches back (VC_..._Switch, the FCU's windows
# FSL_FCU_*). So the copilot clicks a control a step at a time until its variable reads the position, as a hand on
# it would. Tried against the sim 2026-10-09 (an A321neo, on battery): lights, flap and speedbrake levers, the FCU's
# knobs and 100/1,000 switch, the first officer's baro (turn, STD), RMP 1's knobs and transfer. Not yet seen powered:
# the transponder's digits (CLR took; digits didn't, cold), the gear lever (not moved on the ground), the FCU's
# push and pull (no answer with the FMGC off: its modes are the pilot's).
[aircraft]
name = "FSLabs Airbus"
match = ["FSLabs", "FSL A3"]
reads_autopilot = false   # nothing reads its autopilot's engagement
flaps = "detents"
detents = ["up", "1", "2", "3", "full"]
aliases = { "one plus f" = "1", "1 plus f" = "1", "1+f" = "1", "config full" = "full", "zero" = "up", "0" = "up" }
vfe = [0, 230, 215, 195, 190]
gear_extend_kt = 250
gear_retract_kt = 220
gear_extended_kt = 280
first_detent_ground = "1+F"
speed_check_kt = 100
rollout_call_kt = 70
vmo_kt = 350
spoilers = true
landing_detent = "3"
reversers = true
ceiling_ft = 39000
short_runway_ft = 7000
cannot = ["ap_mode"]   # the FCU's modes as such (its altitude and heading knobs are pushed and pulled below)

# What the copilot sees by: the aircraft's own switch positions (0, 10, 20 a step; the flap lever 105 a detent).
[reads]
light_landing = "L:VC_OVHD_EXTLT_Land_L_Switch >= 15"   # 0 retract, 10 off, 20 on
light_taxi = "L:VC_OVHD_EXTLT_Nose_Switch >= 5"         # 0 off, 10 taxi, 20 takeoff
light_strobe = "L:VC_OVHD_EXTLT_Strobe_Switch >= 15"    # 0 off, 10 auto, 20 on
light_beacon = "L:VC_OVHD_EXTLT_Beacon_Switch >= 5"
light_nav = "L:VC_OVHD_EXTLT_NavLogo_Switch >= 5"       # 0 off, 10 "1", 20 "2"
light_logo = "L:VC_OVHD_EXTLT_NavLogo_Switch >= 5"
flaps_index = "L:VC_PED_FLAP_LEVER / 105"
flaps_positions = "4"                                   # (the sim counts 0-8)
parking_brake = "L:VC_PED_PARK_BRAKE_Switch >= 50"
seatbelt = "L:VC_OVHD_SIGNS_SeatBelts_Switch >= 5"
ap_speed_sel = "L:FSL_FCU_SPD"
ap_heading_sel = "L:FSL_FCU_HDG"
ap_altitude_sel = "L:FSL_FCU_ALT"
ap_vs_sel = "L:FSL_FCU_VS"
baro_std = "L:FSL_EFIS_FO_BARO_STD"   # (not a field: read for the altimeter)
# Its APU's N1 (in its own systems: the sim's APU PCT RPM sat at 0 with the APU started), a percent. Not yet seen
# against the sim: in the aircraft's list of variables.
apu_pct = "L:INI_APU_N1 / 100"

[actions.light_landing]
knobs = [{ var = "L:VC_OVHD_EXTLT_Land_L_Switch", up = 72497, down = 72496, step = 10 },
         { var = "L:VC_OVHD_EXTLT_Land_R_Switch", up = 72507, down = 72506, step = 10 }]
on = 20
off = 0

[actions.light_taxi]
var = "L:VC_OVHD_EXTLT_Nose_Switch"
click_up = 72512
click_down = 72511
step = 10
on = 10

[actions.light_strobe]
var = "L:VC_OVHD_EXTLT_Strobe_Switch"
click_up = 72472
click_down = 72471
step = 10
on = 20
off = 10   # AUTO: an Airbus's strobes "off" (dark on the ground)

[actions.light_beacon]
var = "L:VC_OVHD_EXTLT_Beacon_Switch"
click_up = 72477
click_down = 72476
step = 10
on = 10

[actions.light_nav]
var = "L:VC_OVHD_EXTLT_NavLogo_Switch"
click_up = 72487
click_down = 72486
step = 10
on = 10

[actions.light_logo]
var = "L:VC_OVHD_EXTLT_NavLogo_Switch"
click_up = 72487
click_down = 72486
step = 10
on = 10

# The seat belts sign (the overhead's SIGNS panel): up is ON, +1 a step up.
[actions.seatbelt]
var = "L:VC_OVHD_SIGNS_SeatBelts_Switch"
click_up = 72547
click_down = 72546
step = 10
on = 20
off = 0

# The gear lever: 0 down, 100 up. Its codes are the other way round in the two cockpit models (76001 up in one,
# 76000 in the other): the copilot tries the other when the lever doesn't move (sim_bridge/knob.py).
[actions.gear_up]
var = "L:VC_GEAR_Lever"
click_up = 76000
click_down = 76001
step = 100
on = 100

[actions.gear_down]
var = "L:VC_GEAR_Lever"
click_up = 76000
click_down = 76001
step = 100
on = 0

# The flap lever: 0 up, 105 a detent (+0 is a step down the quadrant, more flap).
[actions.flaps_0]
var = "L:VC_PED_FLAP_LEVER"
click_up = 78364
click_down = 78365
step = 105
scale = 105

[actions.flaps_1]
var = "L:VC_PED_FLAP_LEVER"
click_up = 78364
click_down = 78365
step = 105
scale = 105

[actions.flaps_2]
var = "L:VC_PED_FLAP_LEVER"
click_up = 78364
click_down = 78365
step = 105
scale = 105

[actions.flaps_3]
var = "L:VC_PED_FLAP_LEVER"
click_up = 78364
click_down = 78365
step = 105
scale = 105

[actions.flaps_4]
var = "L:VC_PED_FLAP_LEVER"
click_up = 78364
click_down = 78365
step = 105
scale = 105

# The FCU's knobs (+5 a click clockwise, +6 back).
[actions.speed]
var = "L:FSL_FCU_SPD"
click_up = 71226
click_down = 71227

[actions.heading]
var = "L:FSL_FCU_HDG"
click_up = 71240
click_down = 71241

[actions.vs]
var = "L:FSL_FCU_VS"
click_up = 71275
click_down = 71276
step = 100

[actions.altitude]
var = "L:FSL_FCU_ALT"
click_up = 71261
click_down = 71262
step = 100
learn = true            # 100 or 1,000 a click, as the 100/1000 switch is
fine_var = "L:VC_GSLD_FCU_100_1000_Switch"   # 0 at 100, 10 at 1,000: an altitude between thousands wants 100
fine_value = 0
fine_codes = [71243]

# The FCU's knobs pushed and pulled (a left click pushes, a right click pulls; each then released, +3 and +4): the
# altitude pushed once a new one shows in the air (the climb or descent managed), the heading pulled (flown).
[actions.altitude_push]
press = [71249, 71252]

[actions.heading_pull]
press = [71229, 71232]

# The first officer's baro knob (its own side; the captain's is the captain's): +5 up, +6 down, a hundredth of an
# inch (or a hectopascal) a click; pulled for STD, pushed back for QNH (then released).
[actions.altimeter]
var = "L:FSL_EFIS_FO_BARO"
click_up = 71078
click_down = 71079
press = [71081, 71083]
fine_codes = [71080, 71083]
fine_var = "L:FSL_EFIS_FO_BARO_UNIT"   # 1 in inches

# VHF 1 on RMP 1: the outer knob's MHz, then the inner's kHz (5 a click at 8.33 spacing, 25 at 25; it speeds up from
# the third click in quick succession, so two at a time), transfer.
[actions.com_standby]
var = "L:FSL_RMP1.VHF.STBY"
knobs = [{ up = 77554, down = 77553, div = 1000 }, { up = 77561, down = 77560, mod = 1000, step = 5, learn = true, burst = 2 }]

[actions.com_active]
var = "L:FSL_RMP1.VHF.STBY"
knobs = [{ up = 77554, down = 77553, div = 1000 }, { up = 77561, down = 77560, mod = 1000, step = 5, learn = true, burst = 2 }]
press = [77518, 77520]

# The APU: MASTER SW, then START (overhead push buttons: pressed +0, released +2), and its bleed. Toggles: the copilot
# only presses them when the APU's speed says they're needed.
[actions.apu_start]
press = [72516, 72518, 72520, 72522]
gap_s = 1.5

[actions.apu_stop]
press = [72516, 72518]

[actions.apu_bleed_on]
press = [72418, 72420]

[actions.apu_bleed_off]
press = [72418, 72420]

# The transponder's keypad: each digit pressed and released.
[actions.squawk]
keys = { "0" = 78327, "1" = 78292, "2" = 78297, "3" = 78302, "4" = 78307, "5" = 78312, "6" = 78317, "7" = 78322 }
release = 2
clear = 78332   # CLR rubs out one digit: pressed once a digit first, so the code is typed into an empty window
gap_s = 0.4     # its keys take a moment (pressed 0.15 s apart, 1-6-2-1 didn't take; CLR once, then 4-7-0-1, made 1204)
