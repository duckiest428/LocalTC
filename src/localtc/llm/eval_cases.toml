# Seeded edge cases for the understanding path: transmissions the grammar alone gets wrong or
# can't handle, plus traps for the model. Each case is graded on the FINAL interpretation
# (model + grammar + checks), which is what ATC acts on.
#
#   localtc llm eval            run them against your local model
#   pytest tests/test_llm.py    run them offline with the scripted `model` answers below
#
# `model` is a plausible answer from a small model (sometimes a deliberately bad one) used by the
# offline tests; fields left out are filled with "" / false.
# expect: kind (readback | request | unknown), intent (or intent_any), status, missing, mismatched,
#         values (subset), not_kind.

# --- readbacks ---------------------------------------------------------------------------------

[[case]]
name = "takeoff readback without the runway, '-ed' dropped"
phase = "RUNWAY_HOLD"
station = "Montreal Tower"
instruction = "tower.takeoff"
slots = { runway = "06L" }
pilot = "Clear for takeoff, DP69"
model = { kind = "readback", cleared_for_takeoff = true }
expect = { kind = "readback", status = "incomplete", missing = ["runway"] }

[[case]]
name = "takeoff readback with extra words"
phase = "RUNWAY_HOLD"
station = "Montreal Tower"
instruction = "tower.takeoff"
slots = { runway = "06L" }
pilot = "rolling zero six left, cleared for take off, delta papa six niner"
model = { kind = "readback", runway = "06L", cleared_for_takeoff = true }
expect = { kind = "readback", status = "correct" }

[[case]]
name = "IFR clearance readback, speech recognizer style"
phase = "PARKED"
station = "Montreal Clearance"
instruction = "clearance.ifr"
slots = { destination = "Quebec", altitude = 5000, cruise = 12000, frequency = 120.42, squawk = "5015" }
pilot = "cleared to quebec as filed, climb maintain 5000, expect 12,000 10 minutes after, departure 120.42, squawk 5015, DP69"
model = { kind = "readback", altitude = "5000", cruise = "12000", frequency = "120.42", squawk = "5015" }
expect = { kind = "readback", status = "correct" }

[[case]]
name = "wrong squawk; the model copies the expected one instead of what was said"
phase = "PARKED"
station = "Montreal Clearance"
instruction = "clearance.ifr"
slots = { destination = "Quebec", altitude = 5000, cruise = 12000, frequency = 120.42, squawk = "5015" }
pilot = "climb and maintain five thousand, departure one two zero point four two, squawk five zero five one, DP69"
model = { kind = "readback", altitude = "5000", frequency = "120.42", squawk = "5015" }
expect = { kind = "readback", status = "incorrect", mismatched = ["squawk"] }

[[case]]
name = "frequency read back without 'point'"
phase = "RUNWAY_HOLD"
station = "Montreal Ground"
instruction = "ground.handoff_tower"
slots = { station = "Montreal Tower", frequency = 119.3 }
pilot = "tower one one niner three, DP69"
model = { kind = "readback", frequency = "119.3" }
expect = { kind = "readback", status = "correct" }

[[case]]
name = "frequency read back with 'decimal'"
phase = "DEPARTURE"
station = "Montreal Tower"
instruction = "tower.handoff_departure"
slots = { station = "Montreal Departure", frequency = 120.42 }
pilot = "one twenty decimal four two, DP69"
model = { kind = "readback", frequency = "120.42" }
expect = { kind = "readback", status = "correct" }

[[case]]
name = "wrong frequency read back"
phase = "DEPARTURE"
station = "Montreal Tower"
instruction = "tower.handoff_departure"
slots = { station = "Montreal Departure", frequency = 120.42 }
pilot = "departure one two zero point five two, DP69"
model = { kind = "readback", frequency = "120.52" }
expect = { kind = "readback", status = "incorrect", mismatched = ["frequency"] }

[[case]]
name = "asking for a repeat while a readback is due"
phase = "PARKED"
station = "Montreal Clearance"
instruction = "clearance.ifr"
slots = { destination = "Quebec", altitude = 5000, cruise = 12000, frequency = 120.42, squawk = "5015" }
pilot = "say again the squawk for DP69"
model = { kind = "request", intent = "say_again" }
expect = { kind = "request", intent = "say_again" }

[[case]]
name = "altitude read back as 'up to'"
phase = "DEPARTURE"
station = "Montreal Departure"
instruction = "departure.radar_contact"
slots = { station = "Montreal Departure", altitude = 12000 }
pilot = "up to one two thousand, DP69"
model = { kind = "readback", altitude = "12000" }
expect = { kind = "readback", status = "correct" }

[[case]]
name = "landing clearance read back, '-ed' dropped"
phase = "APPROACH"
station = "Quebec Tower"
instruction = "tower.land"
slots = { runway = "06", wind = "060@8" }
pilot = "clear to land zero six, DP69"
model = { kind = "readback", runway = "06", cleared_to_land = true }
expect = { kind = "readback", status = "correct" }

[[case]]
name = "'standby' is not a readback"
phase = "PARKED"
station = "Montreal Clearance"
instruction = "clearance.ifr"
slots = { destination = "Quebec", altitude = 5000, cruise = 12000, frequency = 120.42, squawk = "5015" }
pilot = "DP69 standby"
model = { kind = "unintelligible" }
expect = { not_kind = "readback" }

[[case]]
name = "hallucination: the model invents a readback the pilot never made"
phase = "DEPARTURE"
station = "Montreal Tower"
instruction = "tower.handoff_departure"
slots = { station = "Montreal Departure", frequency = 120.42 }
pilot = "roger, DP69"
model = { kind = "readback", frequency = "120.42" }
expect = { kind = "request", intent = "acknowledge" }

