# The happy path plus unscripted moments: direct-to, a ride report, a different runway, vectors.
# Grammar only (no model), so every one of these must work without the language model too.
[scenario]
name = "unscripted"
recording = "../fixtures/ifr_kpae_kbfi"
airports = ["../fixtures/airports"]
vars = { atis = "bravo" }

[flight]
destination = "KBFI"
cruise_ft = 5000

[atc]
seed = 7

# --- clearance and taxi ---------------------------------------------------------------
[[pilot]]
when = { phase = "PARKED", after_s = 5 }
tune = "clearance"
say = "Paine Clearance, {callsign}, IFR to Boeing Field, with information {atis}, ready to copy."

[[pilot]]
on = "clearance.ifr"
say = "{readback}"

[[pilot]]
when = { phase = "PARKED", cleared = "ifr" }
tune = "ground"
delay_s = 5
say = "Paine Ground, {callsign_short}, at parking, ready to taxi with information {atis}."

[[pilot]]
on = "ground.taxi_out"
say = "{readback}"

# --- tower ------------------------------------------------------------------------------
[[pilot]]
on = "ground.handoff_tower"
say = "{readback}"

[[pilot]]
on = "ground.handoff_tower"
tune = "handoff"
delay_s = 8
say = "Paine Tower, {callsign_short}, holding short runway {departure_runway}, ready for departure."

[[pilot]]
on = "tower.takeoff"
say = "{readback}"

[[pilot]]
on = "tower.handoff_departure"
say = "{readback}"

# --- enroute ------------------------------------------------------------------------------
[[pilot]]
on = "tower.handoff_departure"
tune = "handoff"
delay_s = 8
say = "Seattle Departure, {callsign_short}, {alt} climbing 5,000."

[[pilot]]
on = "departure.radar_contact"
say = "{readback}"

[[pilot]]
on = "departure.handoff_center"
say = "{readback}"

[[pilot]]
on = "departure.handoff_center"
tune = "handoff"
delay_s = 8
say = "Seattle Center, {callsign_short}, level 5,000."

[[pilot]]
on = "center.checkin"
delay_s = 20
say = "Center, {callsign_short}, request direct Boeing Field."

[[pilot]]
on = "common.direct"
say = "{readback}"

[[pilot]]
on = "common.direct"
delay_s = 25
say = "Center, {callsign_short}, light chop at five thousand."

[[pilot]]
on = "center.descend"
say = "{readback}"

[[pilot]]
on = "center.descend"
delay_s = 6
say = "Center, {callsign_short}, request the RNAV runway 14R instead."

[[pilot]]
on = "common.expect_approach"
say = "{readback}"

[[pilot]]
on = "center.handoff_approach"
say = "{readback}"

[[pilot]]
on = "center.handoff_approach"
tune = "handoff"
delay_s = 8
say = "Seattle Approach, {callsign_short}, {alt} descending 3,000."

[[pilot]]
on = "center.checkin_descend"
say = "{readback}"

# --- arrival ------------------------------------------------------------------------------
[[pilot]]
on = "approach.descend"
say = "{readback}"

[[pilot]]
on = "approach.descend"
delay_s = 8
say = "Approach, {callsign_short}, request vectors."

[[pilot]]
on = "approach.vectors"
say = "{readback}"

[[pilot]]
on = "approach.downwind"
say = "{readback}"

[[pilot]]
on = "approach.base"
say = "{readback}"

[[pilot]]
on = "approach.intercept_cleared"
say = "{readback}"

[[pilot]]
on = "approach.handoff_tower"
say = "{readback}"

[[pilot]]
on = "approach.handoff_tower"
tune = "handoff"
delay_s = 6
say = "Boeing Tower, {callsign_short}, 6 mile final runway {arrival_runway}."

[[pilot]]
on = "approach.cleared"
say = "{readback}"

[[pilot]]
on = "approach.cleared"
tune = "handoff"
delay_s = 8
say = "Boeing Tower, {callsign_short}, 6 mile final runway {arrival_runway}."

[[pilot]]
on = "tower.land"
say = "{readback}"

[[pilot]]
on = "tower.exit_contact_ground"
say = "{readback}"

[[pilot]]
on = "tower.exit_contact_ground"
tune = "handoff"
delay_s = 8
say = "Boeing Ground, {callsign_short}, clear of runway {arrival_runway}, taxi to parking."

[[pilot]]
on = "ground.taxi_in"
say = "{readback}"
